<title>Laboratorio de IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cuaderno de laboratorio. Índice de lecciones a la izquierda, lección activa a la derecha.
   Metáfora central: el continuo capacidad (verde azulado) → limitación (ámbar). */
:root {
  --bg: #EDF1F2;
  --surface: #FFFFFF;
  --ink: #15242B;
  --muted: #56676F;
  --line: #D0DADE;
  --cap: #0E6E6A;
  --cap-soft: #DCEFEC;
  --lim: #A9600D;
  --lim-soft: #F7E9D6;
  --ok: #1D7A3E;
  --bad: #B3362B;
  --card: #FFFDF6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171A; --surface: #172227; --ink: #E3ECEE; --muted: #94A6AD; --line: #2B3A41;
    --cap: #45BDB4; --cap-soft: #173A38; --lim: #E6A75A; --lim-soft: #3D2C17;
    --ok: #5CC985; --bad: #F07A6E; --card: #1C2A2F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171A; --surface: #172227; --ink: #E3ECEE; --muted: #94A6AD; --line: #2B3A41;
  --cap: #45BDB4; --cap-soft: #173A38; --lim: #E6A75A; --lim-soft: #3D2C17;
  --ok: #5CC985; --bad: #F07A6E; --card: #1C2A2F; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.6rem, 3.2vw, 2.2rem); font-weight: 700; }
h2 { font-size: clamp(1.35rem, 2.6vw, 1.75rem); font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--cap); outline-offset: 2px; }
a { color: var(--cap); }
.eyebrow { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; }
header.top .sub { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.top-right { display: flex; flex-direction: column; gap: 10px; min-width: 220px; flex: 0 1 300px; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress .bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cap), var(--lim)); transition: width .4s ease; }
.progress .lbl { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
nav.lessons { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 2px; }
nav.lessons button {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center;
  text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; color: var(--ink);
}
nav.lessons button .n { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
nav.lessons button .t { font-size: .93rem; line-height: 1.3; }
nav.lessons button .s { font-size: .8rem; color: var(--ok); font-weight: 700; }
nav.lessons button:hover { background: var(--surface); }
nav.lessons button[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--cap); }
nav.lessons .sep { height: 1px; background: var(--line); margin: 6px 10px; }

main { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.lesson-head { display: flex; flex-direction: column; gap: 8px; }
.lesson-head .en { font-family: var(--font-mono); font-size: .82rem; color: var(--muted); }
.head-row { display: flex; gap: 12px 18px; flex-wrap: wrap; align-items: center; font-size: .9rem; }

ul.ideas { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
ul.ideas li { padding-left: 22px; position: relative; max-width: 72ch; }
ul.ideas li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; border-radius: 2px; background: var(--cap); }
.terms { display: flex; flex-wrap: wrap; gap: 8px; }
.term { font-size: .85rem; border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; background: var(--bg); }
.term b { font-family: var(--font-mono); font-weight: 600; font-size: .8rem; }
.hint { color: var(--muted); font-size: .92rem; max-width: 70ch; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 13px; text-align: left; }
.chip:hover { border-color: var(--cap); }
.chip[aria-pressed="true"] { border-color: var(--cap); background: var(--cap-soft); }
.chip.right { border-color: var(--ok); }
.chip.wrong { border-color: var(--bad); }
.chip.small { padding: 5px 10px; font-size: .86rem; }
.btn { border: 0; background: var(--cap); color: var(--surface); border-radius: 9px; padding: 9px 16px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--cap); border: 1.5px solid var(--cap); }
.btn.done { background: var(--ok); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.out { border-radius: 10px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); max-width: 75ch; }
.out.good { border-color: var(--ok); }
.out.warn { border-color: var(--lim); background: var(--lim-soft); }
.out.cap { border-color: var(--cap); background: var(--cap-soft); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); min-width: 0; }
.mono { font-family: var(--font-mono); font-size: .88rem; }
.tag-ok { color: var(--ok); font-weight: 700; }
.tag-bad { color: var(--bad); font-weight: 700; }
textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 110px; resize: vertical; }
.wbody { display: flex; flex-direction: column; gap: 12px; }

.continuum { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.continuum button { border: 0; padding: 8px 2px; font-size: .78rem; border-radius: 6px; background: var(--bg); color: var(--ink); outline: 1.5px solid var(--line); outline-offset: -1.5px; }
.continuum button:nth-child(1) { background: var(--cap-soft); }
.continuum button:nth-child(5) { background: var(--lim-soft); }
.continuum button[aria-pressed="true"] { outline: 2.5px solid var(--ink); outline-offset: -2.5px; font-weight: 700; }
.continuum button.sugg { box-shadow: inset 0 -4px 0 var(--cap); }
.scale-lbl { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.scale-lbl span:first-child { color: var(--cap); }
.scale-lbl span:last-child { color: var(--lim); }

.hunt { font-size: 1.05rem; line-height: 2; max-width: 70ch; }
.hunt .tok { cursor: pointer; border-radius: 4px; padding: 1px 3px; border-bottom: 1.5px dashed var(--line); }
.hunt .tok:hover { background: var(--bg); }
.hunt .tok.on { background: var(--lim-soft); border-bottom-color: var(--lim); }
.hunt.revealed .tok.risk { background: var(--lim-soft); border-bottom: 2px solid var(--lim); }
.hunt.revealed .tok.risk.on::after { content: " ✓"; color: var(--ok); font-weight: 700; }
.hunt.revealed .tok.on:not(.risk) { background: transparent; text-decoration: line-through; }

.corpus { display: flex; flex-wrap: wrap; gap: 6px; }
.corpus span { font-family: var(--font-mono); font-size: .82rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.sentence { font-family: var(--font-mono); font-size: 1.15rem; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); min-height: 56px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sentence .w { padding: 2px 7px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); }
.sentence .w.last { border-color: var(--cap); background: var(--cap-soft); }
.probs { display: flex; flex-direction: column; gap: 6px; }
.prob { display: grid; grid-template-columns: 110px 1fr 54px; gap: 10px; align-items: center; font-family: var(--font-mono); font-size: .85rem; }
.prob .track { height: 14px; background: var(--bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.prob .fill { height: 100%; background: var(--cap); transition: width .3s ease; }
.prob .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.ctrl { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.ctrl label { display: flex; gap: 8px; align-items: center; font-size: .92rem; }
.ctrl input[type=range] { accent-color: var(--cap); width: 150px; }

/* Embeddings */
.emb { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.emb svg { width: 100%; max-width: 100%; height: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; cursor: crosshair; touch-action: manipulation; }
.emb svg text { font-family: var(--font-mono); font-size: 9px; fill: var(--muted); }
.emb svg .doc { fill: var(--cap); }
.emb svg .doc.near { fill: var(--lim); }
.emb svg .q { fill: var(--ink); }
.emb svg .lnk { stroke: var(--lim); stroke-width: 1.5; stroke-dasharray: 3 3; }
.emb svg .ax { stroke: var(--line); stroke-width: 1; }
.emb svg .dl { font-size: 8.5px; fill: var(--ink); }
.nn { display: flex; flex-direction: column; gap: 6px; }
.nn .row { display: grid; grid-template-columns: 1fr 64px; gap: 8px; font-size: .92rem; padding: 6px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.nn .row span:last-child { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

/* Ventana de contexto */
.ctxwin { display: flex; flex-direction: column; gap: 6px; }
.msg { font-size: .9rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; grid-template-columns: 34px 1fr; gap: 8px; }
.msg .i { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.msg.out-win { opacity: .4; text-decoration: line-through; background: transparent; }
.msg.key { border-color: var(--lim); }
.msg.pinned { border-color: var(--cap); background: var(--cap-soft); }
.winbox { border: 2px solid var(--cap); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.winbox .eyebrow { color: var(--cap); }

/* Test de memoria */
.flash { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; text-align: center; padding: 28px 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); min-height: 110px; display: flex; align-items: center; justify-content: center; }
.bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 130px; padding: 8px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.bars div { background: var(--cap); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.bars div.mid { background: var(--lim); }
.bars-lbl { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; font-family: var(--font-mono); font-size: .68rem; color: var(--muted); text-align: center; padding: 0 8px; }

/* Pasos revelables */
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 4px; }
.step.lit { border-color: var(--lim); }
.step.goal { border-color: var(--bad); }
.step.fix { border-color: var(--ok); }
.quote { font-family: var(--font-mono); font-size: .86rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }

/* Ficha de examen */
.ficha { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;
  background-image: repeating-linear-gradient(var(--card) 0 27px, var(--line) 27px 28px); background-position: 0 44px; }
.ficha .fh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; background: var(--card); }
.ficha dl { margin: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 14px; }
.ficha dt { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--cap); padding-top: 3px; }
.ficha dd { margin: 0; font-size: .95rem; }
.ficha .rec { border-top: 1.5px solid var(--lim); padding-top: 8px; font-weight: 700; background: var(--card); }
.fichas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }

/* Chat */
.chatlog { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; padding: 4px; }
.bub { max-width: 85%; padding: 10px 13px; border-radius: 12px; white-space: pre-wrap; font-size: .95rem; }
.bub.me { align-self: flex-end; background: var(--cap); color: var(--surface); border-bottom-right-radius: 3px; }
.bub.ai { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
.bub.ai.thinking { color: var(--muted); font-style: italic; }
.chatform { display: flex; gap: 8px; }
.chatform input { flex: 1; min-width: 0; }

.q { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; padding-top: 0; }
.q .opts { display: flex; flex-direction: column; gap: 6px; }
.q .opts .chip { width: 100%; }
.done-banner { display: flex; gap: 10px; align-items: center; font-weight: 700; color: var(--ok); }
.score { font-family: var(--font-display); font-size: 2rem; font-weight: 700; }

/* Cursos y ruta */
.ctabs { display: flex; gap: 8px; flex-wrap: wrap; }
.ctab { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 14px; font-size: .9rem; display: flex; gap: 8px; align-items: center; }
.ctab .k { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.ctab[aria-current="true"] { border-color: var(--cap); background: var(--cap-soft); font-weight: 700; }
.route-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.ccard { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); min-width: 0; }
.minibar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--cap); }
.pill { font-family: var(--font-mono); font-size: .72rem; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); align-self: flex-start; }
.pill.done { color: var(--ok); border-color: var(--ok); }
.pill.prog { color: var(--cap); border-color: var(--cap); }
.doms { display: flex; flex-direction: column; gap: 8px; }
.dom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(80px, 160px) 44px; gap: 10px; align-items: center; font-size: .92rem; }
.dom .track { height: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.dom .fill { height: 100%; background: var(--lim); }
.dom .pct { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.sel { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.facts div { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.facts b { font-family: var(--font-display); font-size: 1.15rem; }
.sim-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dot { width: 30px; height: 30px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--bg); font-family: var(--font-mono); font-size: .72rem; padding: 0; }
.dot.ans { background: var(--cap-soft); }
.dot.cur { border-color: var(--ink); font-weight: 700; }
.dot.flag { box-shadow: inset 0 -4px 0 var(--lim); }
.dot.ok { border-color: var(--ok); }
.dot.bad { border-color: var(--bad); }
.steps-list { display: flex; flex-direction: column; gap: 6px; }
.step-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.step-row:hover { border-color: var(--cap); }
.step-row .num { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--cap); text-align: center; }
.step-row .st { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.objs { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; max-width: 72ch; }

@media (max-width: 820px) {
  .ctabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .ctab { flex: 0 0 auto; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.lessons { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  nav.lessons button { grid-template-columns: auto auto; flex: 0 0 auto; background: var(--surface); border: 1px solid var(--line); }
  nav.lessons button .t { display: none; }
  nav.lessons button.fichas-nav .t { display: inline; }
  nav.lessons .sep { display: none; }
  nav.lessons button[aria-current="true"] { box-shadow: inset 0 -3px 0 var(--cap); }
  .panel { padding: 16px; }
  .prob { grid-template-columns: 84px 1fr 46px; }
  .emb { grid-template-columns: minmax(0, 1fr); }
  .ficha dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .ficha dd { margin-bottom: 6px; }
  .fichas-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Ruta Claude Associate · examen Claude Certified Associate – Foundations</div>
      <h1>Laboratorio de IA</h1>
      <p class="sub">La ruta Claude Associate, paso a paso, en español: resumen, ejercicios para tocar los conceptos, ficha de examen y un tutor al que preguntar dudas.</p>
    </div>
    <div class="top-right">
      <div class="progress" aria-live="polite">
        <div class="lbl" id="progLbl">0 de 14 lecciones completadas</div>
        <div class="bar"><i id="progBar"></i></div>
      </div>
      <button class="btn ghost" id="goFichas">Ver todas las fichas de examen</button>
    </div>
  </header>

  <div class="ctabs" id="ctabs" role="tablist" aria-label="Cursos de la certificación"></div>

  <div class="layout">
    <nav class="lessons" id="nav" aria-label="Lecciones"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
(function () {
  "use strict";

  const store = {
    get(k, d) { try { const v = localStorage.getItem("labia:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("labia:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  let done = store.get("done", {});

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const strip = s => String(s).replace(/<[^>]+>/g, "");
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function wMarkov(el) {
    let corpus = ["el gato come pescado", "el gato duerme mucho", "el gato come mucho", "el perro come carne", "el perro duerme poco", "la niña come fruta", "la niña duerme poco", "el perro corre mucho"];
    let counts = {}, sent = [], temp = 1, topk = 0;
    const START = "·inicio·", END = "·fin·";
    const train = () => {
      counts = {};
      corpus.forEach(s => { const w = [START].concat(s.toLowerCase().split(/\s+/).filter(Boolean), [END]);
        for (let i = 0; i < w.length - 1; i++) { (counts[w[i]] = counts[w[i]] || {}); counts[w[i]][w[i + 1]] = (counts[w[i]][w[i + 1]] || 0) + 1; } });
    };
    const dist = () => {
      const prev = sent.length ? sent[sent.length - 1] : START;
      let entries = Object.entries(counts[prev] || {}).sort((a, b) => b[1] - a[1]);
      if (topk > 0) entries = entries.slice(0, topk);
      const ws = entries.map(([w, c]) => [w, Math.pow(c, 1 / temp)]);
      const tot = ws.reduce((a, b) => a + b[1], 0) || 1;
      return { prev, list: ws.map(([w, v]) => [w, v / tot]) };
    };
    el.innerHTML = `
      <p class="hint">Un modelo muy simple que solo mira la palabra anterior. Cuenta en las frases de entrenamiento qué palabra suele venir después y elige la siguiente al azar según esas probabilidades. Es la misma idea que el autocompletado del móvil.</p>
      <div class="card"><span class="eyebrow">Frases de entrenamiento</span><div class="corpus" id="mc"></div>
        <div class="chips"><input type="text" id="mi" placeholder="Añade una frase, p. ej.: el gato corre poco" style="flex:1;min-width:0"><button class="btn ghost" id="ma">Entrenar con ella</button></div></div>
      <div class="sentence" id="ms" aria-live="polite"></div>
      <div class="card"><span class="eyebrow" id="mh"></span><div class="probs" id="mp"></div></div>
      <div class="ctrl">
        <button class="btn" id="mg">Generar siguiente palabra</button>
        <button class="btn ghost" id="mr">Empezar de nuevo</button>
        <label for="mt">Temperatura <input type="range" id="mt" min="0.2" max="3" step="0.1" value="1"> <span class="mono" id="mtv">1.0</span></label>
        <label for="mk">Top-k <input type="range" id="mk" min="0" max="4" step="1" value="0"> <span class="mono" id="mkv">todas</span></label>
      </div>
      <div class="out" id="mn">Pulsa «Generar siguiente palabra» varias veces y mira cómo cambian las barras.</div>`;
    const $ = s => el.querySelector(s);
    const render = () => {
      $("#mc").innerHTML = corpus.map(s => `<span>${esc(s)}</span>`).join("");
      const finished = sent[sent.length - 1] === END;
      $("#ms").innerHTML = sent.length ? sent.filter(w => w !== END).map((w, i, a) => `<span class="w ${i === a.length - 1 ? "last" : ""}">${esc(w)}</span>`).join("") + (finished ? ` <span class="mono" style="color:var(--muted)">(fin de frase)</span>` : "") : `<span class="mono" style="color:var(--muted)">La frase aparecerá aquí…</span>`;
      const d = dist();
      $("#mh").textContent = d.prev === START ? "¿Con qué palabra suelen empezar las frases?" : `Después de «${d.prev}», ¿qué viene?`;
      $("#mp").innerHTML = finished ? `<p class="hint">Frase terminada. Pulsa «Empezar de nuevo».</p>` :
        d.list.map(([w, p]) => `<div class="prob"><span>${esc(w === END ? "(fin)" : w)}</span><div class="track"><div class="fill" style="width:${(p * 100).toFixed(1)}%"></div></div><span class="pct">${Math.round(p * 100)} %</span></div>`).join("") || `<p class="hint">Esta palabra no aparece seguida de nada en el entrenamiento.</p>`;
      $("#mg").disabled = finished || !d.list.length;
    };
    $("#mg").addEventListener("click", () => {
      const d = dist(); let r = Math.random(), pick = d.list[d.list.length - 1][0];
      for (const [w, p] of d.list) { if ((r -= p) <= 0) { pick = w; break; } }
      sent.push(pick); render();
      $("#mn").innerHTML = `Ha elegido ${pick === END ? "el final de la frase" : `«${esc(pick)}»`} con un ${Math.round(d.list.find(x => x[0] === pick)[1] * 100)} % de probabilidad. No ha «pensado» la respuesta: ha tirado un dado con esas probabilidades.`;
    });
    $("#mr").addEventListener("click", () => { sent = []; render(); $("#mn").textContent = "Frase nueva. Con la misma entrada, cada vez puede salir algo distinto: eso es el muestreo."; });
    $("#ma").addEventListener("click", () => { const v = $("#mi").value.trim(); if (!v) return; corpus.push(v); $("#mi").value = ""; train(); sent = []; render(); $("#mn").textContent = "Reentrenado. Fíjate en cómo han cambiado las probabilidades."; });
    $("#mi").addEventListener("keydown", e => { if (e.key === "Enter") $("#ma").click(); });
    $("#mt").addEventListener("input", e => { temp = +e.target.value; $("#mtv").textContent = temp.toFixed(1); render();
      $("#mn").textContent = temp < 0.8 ? "Temperatura baja: la palabra más probable gana casi siempre. Más predecible, más repetitivo." : temp > 1.4 ? "Temperatura alta: las opciones raras ganan peso. Más variado, pero más riesgo de salir del camino." : "Temperatura 1: se usan las probabilidades tal como salen del recuento."; });
    $("#mk").addEventListener("input", e => { topk = +e.target.value; $("#mkv").textContent = topk ? topk : "todas"; render();
      $("#mn").textContent = topk ? `Top-k = ${topk}: solo puede elegir entre las ${topk} palabras más probables.` : "Top-k desactivado: puede elegir cualquier palabra vista."; });
    train(); render();
  }

  // L7: explorador de embeddings
  function wEmbed(el) {
    const DOCS = [
      ["Receta de pollo al horno", .35, .92], ["Cómo cuidar a tu gato", .92, .18], ["Qué comen los gatos", .86, .78],
      ["Historia del Imperio romano", .08, .1], ["Menú vegetariano semanal", .06, .86], ["Razas de perros", .88, .07],
      ["Granja de vacas lecheras", .7, .55], ["Impuestos para autónomos", .16, .04]
    ];
    const PRE = [["pienso para perros", .9, .74], ["cena rápida entre semana", .12, .82], ["mascotas", .95, .3]];
    let q = { t: "pienso para perros", x: .9, y: .74 }, k = 3;
    const S = 300, P = 30, X = v => P + v * (S - 2 * P), Y = v => S - P - v * (S - 2 * P);
    el.innerHTML = `
      <p class="hint">Cada documento es un punto según de qué habla. Eje horizontal: cuánto habla de animales. Eje vertical: cuánto habla de comida. Toca el plano para colocar una búsqueda, o elige una de ejemplo.</p>
      <div class="chips" id="ep">${PRE.map((p, i) => `<button class="chip small" data-i="${i}">«${p[0]}»</button>`).join("")}</div>
      <div class="emb">
        <svg id="es" viewBox="0 0 ${S} ${S}" role="img" aria-label="Plano de significados con documentos y la búsqueda"></svg>
        <div class="wbody">
          <label class="ctrl" for="ek">Vecinos más cercanos <input type="range" id="ek" min="1" max="5" value="3"> <span class="mono" id="ekv">3</span></label>
          <div class="nn" id="en"></div>
          <div class="out cap" id="eo"></div>
        </div>
      </div>`;
    const svg = el.querySelector("#es");
    const render = () => {
      const ranked = DOCS.map(d => { const dist = Math.hypot(d[1] - q.x, d[2] - q.y); return { d, dist, sim: Math.max(0, 1 - dist / Math.SQRT2) }; }).sort((a, b) => a.dist - b.dist);

      const msgs = CONV.slice(0, n), start = Math.max(0, msgs.length - CAP);
      el.querySelector("#wl").innerHTML = `<span class="eyebrow">Conversación completa</span>` + msgs.map((m, i) => `<div class="msg ${i < start ? "out-win" : ""} ${m[2] ? "key" : ""}"><span class="i">${i + 1}</span><span><b>${m[0]}:</b> ${esc(m[1])}</span></div>`).join("");
      const inWin = msgs.slice(start);
      const ruleIn = pinned || start === 0;
      el.querySelector("#wb").innerHTML = `<span class="eyebrow">Lo que el modelo ve ahora (ventana de contexto)</span>` +
        (pinned ? `<div class="msg pinned"><span class="i">fija</span><span><b>Instrucción del proyecto:</b> responde siempre en inglés.</span></div>` : "") +
        inWin.map((m, i) => `<div class="msg ${m[2] ? "key" : ""}"><span class="i">${start + i + 1}</span><span><b>${m[0]}:</b> ${esc(m[1])}</span></div>`).join("");

  // L9: test de memoria (efecto de posición serial)
  function wMemory(el) {
    const WORDS = ["mesa", "río", "lápiz", "nube", "caballo", "tren", "limón", "puerta", "guitarra", "sal", "montaña", "reloj"];
    const hits = new Array(12).fill(0); let runs = 0, timer = null;
    el.innerHTML = `
      <p class="hint">Verás 12 palabras, una cada segundo. Después escribe todas las que recuerdes, en cualquier orden. Repítelo varias veces para ver la curva.</p>
      <div class="flash" id="mf" aria-live="polite">Pulsa «Empezar»</div>
      <div class="chips"><button class="btn" id="mgo">Empezar</button></div>
      <div class="wbody" id="mrec" hidden><textarea id="mta" placeholder="Escribe las palabras que recuerdes, separadas por espacios o comas"></textarea><div class="chips"><button class="btn" id="mok">Comprobar</button></div></div>
      <div class="wbody" id="mres" hidden>
        <span class="eyebrow" id="mrl"></span>
        <div class="bars" id="mb"></div><div class="bars-lbl">${WORDS.map((_, i) => `<span>${i + 1}</span>`).join("")}</div>
        <div class="out cap" id="mo"></div>
      </div>`;
    const $ = s => el.querySelector(s);
    $("#mgo").addEventListener("click", () => {
      clearInterval(timer); $("#mrec").hidden = true; $("#mgo").disabled = true; let i = 0;
      $("#mf").textContent = WORDS[0];
      timer = setInterval(() => { i++; if (i < WORDS.length) $("#mf").textContent = WORDS[i]; else { clearInterval(timer); $("#mf").textContent = "¿Cuáles recuerdas?"; $("#mrec").hidden = false; $("#mta").value = ""; $("#mta").focus(); $("#mgo").disabled = false; $("#mgo").textContent = "Repetir"; } }, 1000);
    });
    $("#mok").addEventListener("click", () => {
      const said = new Set($("#mta").value.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[\s,;.]+/).filter(Boolean));
      const got = WORDS.map(w => said.has(w.normalize("NFD").replace(/[̀-ͯ]/g, "")));
      runs++; got.forEach((g, i) => { if (g) hits[i]++; });
      $("#mres").hidden = false; $("#mrec").hidden = true;
      $("#mrl").textContent = `Recuerdo por posición · ${runs} ${runs === 1 ? "intento" : "intentos"} · esta vez: ${got.filter(Boolean).length} de 12`;
      $("#mb").innerHTML = hits.map((h, i) => `<div class="${i >= 3 && i <= 8 ? "mid" : ""}" style="height:${(h / runs) * 100}%" title="${WORDS[i]}: ${h} de ${runs}"></div>`).join("");
      $("#mo").innerHTML = "Lo normal es recordar mejor las primeras (primacía) y las últimas (recencia), y olvidar las del medio (en ámbar). Es el <b>efecto de posición serial</b>. Los modelos de lenguaje muestran lo mismo: en un estudio de Stanford de 2023, la precisión bajaba más de un 30 % cuando el dato clave estaba en medio del contexto. Regla práctica: pon lo importante al principio y repítelo al final.";
    });
  }

    { id: 5, t: "Pruébalo: predicción del siguiente token", en: "Try It Out: Next Token Prediction", slug: "try-it-out",

        "Un LLM hace lo mismo al final (muestrea de una distribución), pero calcula esas probabilidades mirando muchísimo más contexto."

      recuerda: "La misma pregunta puede dar respuestas distintas: eso es el muestreo.",
      widgets: [["Simulador: tu propio mini modelo de lenguaje", wMarkov], ["Markov frente a un LLM", wMarkovCompare]],
      quiz: [

        { q: "Si subes la temperatura…", o: ["Siempre elige la palabra más probable", "Las palabras poco probables ganan peso", "El modelo aprende más rápido"], a: 1, w: "Más temperatura, más variedad y más riesgo." },
        { q: "¿En qué se parecen una cadena de Markov y Claude?", o: ["Usan la misma red neuronal", "Los dos muestrean la siguiente palabra de una distribución de probabilidad", "Los dos buscan en una base de datos"], a: 1, w: "El último paso es el mismo; cambia cómo se calcula la distribución." }

    { id: 6, t: "Conocimiento", en: "Knowledge", slug: "knowledge",

      ],
      terms: [["Knowledge cutoff", "fecha de corte"], ["Staleness", "desactualización"], ["Uneven coverage", "cobertura desigual"], ["Inherited bias", "sesgo heredado"], ["Source amnesia", "amnesia de la fuente"], ["RAG / retrieval", "recuperación de documentos"], ["Embeddings", "representaciones vectoriales"]],
      ficha: [["Pregunta", "¿Qué sabe realmente el modelo? → ¿Cuánto aparecía en lo que leyó?"], ["Capacidad", "Temas frecuentes, consistentes y anteriores al corte."], ["Limitación", "Raros, posteriores al corte, de nicho, locales o discutidos."], ["Fallos típicos", "Staleness, uneven coverage, inherited bias, source amnesia."], ["Mitigaciones", "Web search, retrieval (RAG/MCP), tool use, aviso explícito de la fecha de corte."], ["4D", "Delegación (¿lo sabe o le doy yo el contexto?) y Discernimiento (qué verificar)."]],
      recuerda: "Brillar en un campo no garantiza brillar en el de al lado.",
      widgets: [["¿Cuánto revisarías?", wContinuum([
        ["Explicar cómo funciona la fotosíntesis", 0, "Tema frecuente, consistente y que no cambia: el ejemplo de la lección."],

      quiz: [

    { id: 8, t: "Memoria de trabajo", en: "Working Memory", slug: "working-memory",

  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

  // ============ Widget: constructor de prompts (Claude 101) ============
  function wPromptBuilder(el) {
    const P = [["pb1", "1 · Prepara el escenario", "Tu rol, tu objetivo y el contexto que Claude debe saber.", "Soy responsable de operaciones en una empresa de logística de 40 personas y preparo la reunión mensual con dirección."],
               ["pb2", "2 · Define la tarea", "Qué acción quieres: escribir, analizar, resumir, crear…", "Resume las incidencias de entregas de octubre a partir del Excel adjunto y propón tres mejoras."],
               ["pb3", "3 · Especifica las reglas", "Formato, tono, longitud, ejemplos.", "Máximo una página, con viñetas, tono directo y sin tecnicismos. Termina con una tabla de las tres mejoras con coste estimado."]];
    const saved = store.get("pb", {});
    el.innerHTML = `<p class="hint">Escribe tu propio prompt con las tres partes que enseña la lección. Puedes partir del ejemplo de los recuadros.</p>` +
      P.map(p => `<div class="wbody" style="gap:6px"><label for="${p[0]}"><b>${p[1]}</b> <span class="hint">${p[2]}</span></label><textarea id="${p[0]}" style="min-height:70px" placeholder="${esc(p[3])}"></textarea></div>`).join("") +
      `<div class="card"><span class="eyebrow">Tu prompt completo</span><div class="quote" id="pbo"></div><div class="chips" id="pbc"></div></div>
      <div class="chips"><button class="btn ghost" id="pbex">Usar el ejemplo</button><button class="btn ghost" id="pbcopy">Copiar el prompt</button><button class="btn" id="pbai" hidden>Pedir a Claude que lo evalúe</button></div>
      <div class="out" id="pbr" hidden></div>`;
    const $ = s => el.querySelector(s);
    P.forEach(p => { $("#" + p[0]).value = saved[p[0]] || ""; });
    const full = () => P.map(p => $("#" + p[0]).value.trim()).filter(Boolean).join("\n\n");
    const upd = () => {
      const v = {}; P.forEach(p => { v[p[0]] = $("#" + p[0]).value; }); store.set("pb", v);
      $("#pbo").textContent = full() || "Escribe en los recuadros de arriba…";
      $("#pbc").innerHTML = P.map(p => { const ok = $("#" + p[0]).value.trim().length > 15; return `<span class="pill ${ok ? "done" : ""}">${ok ? "✓" : "·"} ${p[1].slice(4)}</span>`; }).join("");
    };
    el.addEventListener("input", upd);
    $("#pbex").addEventListener("click", () => { P.forEach(p => { $("#" + p[0]).value = p[3]; }); upd(); });
    $("#pbcopy").addEventListener("click", () => {
      const t = full(); if (!t) return;
      const b = $("#pbcopy");
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => { b.textContent = "Copiado"; }).catch(() => { const r = document.createRange(); r.selectNodeContents($("#pbo")); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = "Selecciónalo y cópialo"; });
    });
    sampleReady.then(s => { if (s) $("#pbai").hidden = false; });
    $("#pbai").addEventListener("click", async () => {
      const t = full(); const out = $("#pbr");
      if (!t || !sampleFn) return;
      out.hidden = false; out.className = "out"; out.textContent = "Claude está leyendo tu prompt…"; $("#pbai").disabled = true;
      try {
        await sampleFn(`Eres un profesor del curso Claude 101. Evalúa este prompt de una persona que está aprendiendo, según las tres partes de la lección: preparar el escenario (rol, objetivo, contexto), definir la tarea y especificar las reglas (formato, tono, longitud, ejemplos). Responde en español, en menos de 150 palabras: una línea por parte con ✓ o ✗ y por qué, y al final una versión mejorada del prompt. No ejecutes la tarea del prompt.\n\nPROMPT:\n${t}`, {
          onText: ({ text }) => { out.className = "out cap"; out.innerHTML = md(text); }
        });
      } catch (e) {
        out.className = "out warn";
        out.textContent = e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un poco." : (e && (e.code === "not_granted" || e.code === "sampling_disabled")) ? "No hay permiso para usar Claude desde esta página." : "No se pudo evaluar. Inténtalo de nuevo.";
      } finally { $("#pbai").disabled = false; }
    });
    upd();
  }

    { id: 5, t: "Introducción a los proyectos", en: "Introduction to projects", slug: "introduction-to-projects",

        "Si el conocimiento se acerca al límite de contexto, el proyecto activa <b>RAG</b>: busca y trae solo lo relevante, hasta 10 veces más capacidad. Los chats no comparten contexto entre sí salvo lo que está en el conocimiento del proyecto.",
        "Permisos (Team y Enterprise): <b>Can view</b> (consultar y chatear), <b>Can edit</b> (cambiar instrucciones y conocimiento, gestionar miembros) y <b>Owner</b> (lo controla todo, incluida la visibilidad). Nombra bien los archivos y mantén el conocimiento al día."

  // ============ Widget: mapa de modelos ============
  function wModelMap(el) {
    const DUR = ["Minutos", "Una hora", "Un día", "Varios días"], CLR = ["Muy claro", "Bastante claro", "Algo abierto", "Pregunta abierta"];
    const EX = [
      [0, 1, "Haiku o Sonnet", "Clasificar 200 correos por tema · reformatear una lista · respuestas rápidas y repetitivas"],
      [2, 3, "Sonnet u Opus", "Redactar un informe con datos que le das · resumir una reunión larga · preparar una presentación con un esquema claro"],
      [4, 5, "Opus", "Analizar varias fuentes para recomendar una decisión · rediseñar un proceso de tu equipo · un plan con muchas piezas"],
      [6, 6, "Opus o Fable", "Proyectos largos y abiertos de varios días: una estrategia nueva, una investigación ambiciosa sin respuesta clara"]
    ];
    el.innerHTML = `<p class="hint">Describe el tipo de trabajo que haces. Es una ilustración del curso, no una regla: también importan lo que está en juego, lo fácil que te resulte comprobarlo y la prisa que tengas.</p>
      <div class="ctrl"><label for="mmd">¿Cuánto te llevaría sin IA? <input type="range" id="mmd" min="0" max="3" value="1"> <span class="mono" id="mmdv"></span></label>
      <label for="mmc">¿Está claro cuál es el resultado correcto? <input type="range" id="mmc" min="0" max="3" value="1"> <span class="mono" id="mmcv"></span></label></div>
      <div class="out cap" id="mmo" aria-live="polite"></div>`;
    const $ = s => el.querySelector(s);
    const upd = () => {
      const d = +$("#mmd").value, c = +$("#mmc").value, s = d + c;
      $("#mmdv").textContent = DUR[d]; $("#mmcv").textContent = CLR[c];
      const e = EX.find(x => s >= x[0] && s <= x[1]);
      $("#mmo").innerHTML = `<b>Modelos que encajan: ${e[2]}</b><br>Tareas parecidas: ${e[3]}.<br><span class="hint">Cuanto más larga y menos definida es la tarea, más ayuda un modelo más capaz.</span>`;
    };
    el.addEventListener("input", upd); upd();
  }

    { id: 5, ideas: ["Capacidades: versatilidad con el lenguaje (redactar, resumir, traducir, explicar), cambiar de tarea sin reentrenarse, seguir el hilo de la conversación y usar herramientas externas.", "Limitaciones: <b>fecha de corte</b> del conocimiento, <b>alucinaciones</b> (afirmaciones seguras pero falsas), límite de la <b>ventana de contexto</b> (lo más antiguo sale primero) y dificultades con razonamientos complejos.", "Son <b>no deterministas</b>: la misma pregunta puede dar respuestas distintas. La <b>temperatura</b> regula esa variabilidad.", "Lo más eficaz combina fortalezas: las personas aportan pensamiento crítico, criterio, creatividad y supervisión ética; la IA, velocidad, escala y detección de patrones."],
      terms: [["Hallucination", "alucinación"], ["Knowledge cutoff", "fecha de corte"], ["Non-deterministic", "no determinista"], ["Temperature", "temperatura"], ["RAG", "recuperación de información"]],

    { id: 7, ideas: ["Elige un proyecto mediano y de varios pasos (unos 60 minutos) que te interese: de comunicación, investigación, creativo o de aprendizaje.", "Habla con Claude para definir qué es el éxito y qué haría el proyecto valioso para ti.", "Divide el proyecto en tareas y, para cada una, decide qué habilidades necesita, qué parte es humana, qué hace bien la IA y dónde colaborar.", "Guarda el plan: lo usarás en las lecciones de Descripción, Discernimiento y Diligencia."],

    { id: 8, ideas: ["Describir no es solo escribir un prompt: es crear un entorno de trabajo en el que tú y la IA rindáis al máximo. La IA no lee la mente.", "<b>Descripción del producto</b>: qué quieres (resultado, formato, público, estilo).", "<b>Descripción del proceso</b>: cómo debe abordarlo (datos, orden, método, ejemplos).", "<b>Descripción del desempeño</b>: cómo quieres que se comporte (conciso o detallado, que te lleve la contraria o te siga).", "La IA no es una base de datos ni una máquina expendedora: es un sistema interactivo."],

    { id: 9, ideas: ["La <b>ingeniería de prompts</b> es diseñar instrucciones eficaces: comunicación humana clara y algunas consideraciones propias de la IA.", "Seis técnicas: <b>dar contexto</b> (qué, por qué y quién eres), <b>enseñar ejemplos</b> (few-shot), <b>especificar restricciones</b> (formato, longitud), <b>dividir en pasos</b>, <b>pedirle que piense antes</b> (antes, no después) y <b>definir rol o tono</b>.", "El arma secreta: <b>pedir a Claude que mejore tu prompt</b>.", "Si no sale bien: más contexto, ejemplos, pasos, variaciones, otro formato, preguntar por la confianza o empezar de cero.", "Errores comunes: suponer que lee la mente, mezclar tareas sin relación, no definir el éxito y no dar feedback."],

    { id: 10, ideas: ["El <b>Discernimiento</b> es tu control de calidad: evaluar qué produce la IA, cómo lo produce y cómo se comporta. Es la otra cara de la Descripción.", "<b>Discernimiento del producto</b>: ¿es correcto, adecuado, coherente, útil?", "<b>Discernimiento del proceso</b>: ¿hay errores lógicos, despistes, pasos inadecuados o razonamientos circulares? Por ejemplo, que reintroduzca ideas que ya descartaste.", "<b>Discernimiento del desempeño</b>: ¿te ayuda su forma de interactuar? ¿Pregunta demasiado, se queda corto, responde bien al feedback?", "Tras evaluar, da feedback: qué falla, por qué y cómo mejorarlo. A veces la solución es describir mejor; otras, replantear la delegación."],

    { id: 11, ideas: ["Aplica Descripción y Discernimiento al proyecto que planificaste en la lección 7.", "Antes de empezar, acuerda con Claude la descripción de producto, proceso y desempeño.", "Para cada tarea: <b>describe</b>, <b>discierne</b> (producto, proceso, desempeño), <b>refina</b> con feedback e <b>integra tu criterio</b>: tú decides qué se queda y respondes del resultado.", "Repite el bucle hasta terminar el proyecto."],

    { id: 12, ideas: ["La <b>Diligencia</b> trata de la responsabilidad: que el uso de la IA sea riguroso, transparente y responsable. Cubre sobre todo lo ético y lo seguro.", "<b>Diligencia en la creación</b>: elegir con criterio qué sistemas usas y cómo (datos, privacidad, políticas de tu organización).", "<b>Diligencia en la transparencia</b>: ser claro sobre el papel de la IA con quien deba saberlo.", "<b>Diligencia en el despliegue</b>: responder de lo que compartes: verificar datos, revisar sesgos y comprobar derechos de uso.", "Una <b>declaración de diligencia</b> reconoce qué hizo la IA, cómo lo revisaste y que asumes la responsabilidad."],

      quiz: [Q("Verificar los datos antes de compartir algo hecho con IA es Diligencia en…", ["La creación", "La transparencia", "El despliegue"], 2, "Deployment."), Q("¿Quién responde del contenido que publicas hecho con IA?", ["La IA", "Tú", "El proveedor"], 1, "Por eso hay que verificar."), Q("Comprobar si la herramienta tiene protección de datos adecuada es…", ["Diligencia en la creación", "Discernimiento", "Descripción"], 0, "Creation Diligence.")] },
    { id: 13, ideas: ["Las 4D se aplican a los tres modos: automatización, aumento y agencia.", "Delegación: tu experiencia y criterio son la base. Descripción: a veces lo mejor no es un prompt elaborado, sino una buena conversación.", "Discernimiento: evaluar es una responsabilidad innegociable. Diligencia: respondes de lo que haces con IA y de su impacto.", "La fluidez se desarrolla con práctica. La IA es potente, pero no es magia: es tan útil y segura como nosotros la hagamos."],

    { id: 2, ideas: ["Prompting como <b>disciplina de comunicación</b> con estructura repetible. La base es la Descripción del marco AI Fluency.", "«Escribe algo sobre los resultados del tercer trimestre» da un párrafo genérico. Con público, los tres resultados que importan, formato y longitud, obtienes un borrador listo.", "<b>Descomponer</b>: divide las peticiones complejas en partes con resultados intermedios que puedas revisar.", "<b>Iterar de forma diagnóstica</b>: identifica qué falta (contexto, ejemplo, formato, objetivo) en vez de repetir la petición.", "Adapta el prompt al tipo de tarea: <b>análisis</b> (datos + supuestos + razonamiento), <b>investigación</b> (fuentes y citas), <b>redacción</b> (público, tono, ejemplo) y <b>lluvia de ideas</b> (muchas opciones variadas antes de elegir)."],

    { id: 3, ideas: ["Es el dominio que más pesa en el examen (21 %). Objetivo: poder <b>respaldar todo lo que firmas</b>.", "Evalúa <b>exactitud y completitud</b> contra las fuentes y los estándares. Un tono seguro, o la confianza que dice tener Claude, no garantiza nada.", "Detecta <b>alucinaciones</b> (sobre todo nombres, fechas, cifras, citas, URLs, números de artículo), <b>incoherencias</b> (dos cifras distintas para lo mismo) y <b>sesgos</b> (supuestos sobre «lo normal»).", "Decide cuándo hace falta <b>revisión humana</b>: lo que sale fuera, lo que compromete a la empresa, lo normativo o legal, lo de alto impacto.", "Adapta al público y comprueba que no se pierde nada. Elige el formato: <b>artifact</b> (reutilizable o compartible), <b>en el chat</b> (respuesta rápida) o <b>datos estructurados</b> (tabla o CSV para otra herramienta)."],

    { id: 4, ideas: ["Pasar de «yo uso Claude» a «nuestro flujo de trabajo usa Claude». La competencia base es la <b>Delegación</b>: para cada paso, decidir si lo hace la IA, una persona o los dos.", "Usa Claude para <b>analizar requisitos</b> y casos de uso: extraer requisitos de entrevistas, agruparlos y señalar huecos y contradicciones para que tú los confirmes.", "Buenos candidatos: tareas <b>repetitivas, bien definidas y verificables</b>. Malos: decisiones únicas de alto riesgo, o resultados que nadie puede comprobar.", "Antes de meterlo en el flujo: prueba con casos pasados de resultado conocido y define quién revisa y cuándo. Mejorar un paso o rediseñar el proceso entero.", "Comunica el valor y los límites con precisión: acelera, pero no elimina la revisión. Las integraciones técnicas a medida se derivan a perfiles Architect o Developer."],

    { id: 5, ideas: ["Un buen prompt ayuda una vez; una buena <b>configuración</b> ayuda siempre. Se configura antes de las conversaciones: proyecto, instrucciones y fuentes de conocimiento.", "<b>Conocimiento</b>: documentos de referencia (guías, plantillas, informes). <b>Instrucciones</b>: normas de comportamiento (contexto, proceso, tono, requisitos).", "Instrucciones eficaces son concretas: para qué es el proyecto, el proceso a seguir, el tono y los requisitos. «Sé útil» no sirve.", "Gestiona conocimiento y conectores: nombres de archivo descriptivos, sin versiones viejas mezcladas con las nuevas. Con un conector (Drive, Gmail) Claude trabaja con la versión actual y solo ve lo que tú ves.", "<b>Mantenimiento</b>: el conocimiento viejo da respuestas viejas. Fija una revisión periódica y un responsable. Así una habilidad pasa de una persona a todo el equipo."],

    { id: 6, ideas: ["La gobernanza importa antes de que algo salga mal: un archivo subido donde no debía o una skill con demasiado acceso puede frenar a todo un equipo.", "<b>Usos apropiados e inapropiados</b>: Claude apoya, pero las decisiones de alto impacto sobre personas (contratar, despedir, sanciones) las toma una persona.", "<b>Sensibilidad de datos</b>: con datos personales o regulados, anonimiza o quita identificadores antes de subirlos, según la política. Decirle a Claude que «no lo guarde» no cumple el control.", "<b>Políticas de la organización</b>: usa solo conectores y skills aprobados; si necesitas otro, pide aprobación. Skills solo de fuentes de confianza.", "<b>Ética</b>: transparencia sobre el uso de IA cuando la política lo pida, y responsabilidad sobre el resultado. Desconfía de las instrucciones escondidas en contenido externo (prompt injection)."],

      quiz: [Q("Una hoja tiene nombres y números de cuenta, y la política restringe esos datos. ¿Qué haces?", ["Subirla tal cual", "Anonimizarla o quitar los identificadores antes de subirla", "Pedirle a Claude que no la guarde"], 1, "Pregunta de ejemplo oficial."), Q("¿Cuál es un uso apropiado en selección de personal?", ["Que Claude decida a quién contratar", "Redactar la oferta y preguntas, y que decida una persona", "Rechazar candidatos sin revisión"], 1, "Claude apoya, decide una persona."), Q("Una web que resumes contiene «ignora tus instrucciones». ¿Qué es?", ["Un error tipográfico", "Una inyección de instrucciones: trátala como no fiable", "Una instrucción válida"], 1, "Prompt injection.")] },
    { id: 7, ideas: ["Ante un mal resultado no se trata de rendirse ni de cambiar cosas al azar: hay que <b>diagnosticar la causa raíz</b>.", "Cuatro causas raíz: <b>falta de especificación</b> (faltan público, objetivo o datos), <b>exceso de contexto</b> (demasiado material, se pierde lo del medio), <b>función o modelo equivocado</b> y <b>configuración desactualizada</b>.", "Ajusta según lo que ves: si se salta instrucciones, sube el esfuerzo antes de cambiar de modelo. Si un chat largo se degrada, empieza otro con lo esencial.", "Convierte un arreglo puntual en <b>permanente</b>: si corriges lo mismo cada semana, llévalo a las instrucciones del proyecto, a una skill o a instrucciones fijas.", "Optimiza el flujo: contexto, formato y verificación compartidos en proyectos y skills."],

      quiz: [Q("Corriges lo mismo cada semana. ¿Arreglo permanente?", ["Seguir corrigiendo", "Llevarlo a las instrucciones del proyecto o a una skill", "Cambiar de modelo cada semana"], 1, "De puntual a permanente."), Q("Un texto vago tras un prompt de una línea suele deberse a…", ["Falta de especificación", "Un modelo demasiado grande", "Exceso de contexto"], 0, "Añade contexto."), Q("Se salta instrucciones aunque el prompt está completo. ¿Qué ajustas primero?", ["Subir el esfuerzo", "Cambiar de modelo", "Acortar el prompt"], 0, "Una cosa cada vez.")] },

  const DOMAIN_COUNTS = { 1: 8, 2: 13, 3: 7, 4: 10, 5: 7, 6: 9, 7: 6 }; // 60 preguntas, según el peso de cada dominio

  // Simulacro

      catch (e) { st.textContent = e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un poco." : (e && e.code === "not_granted") ? "No hay permiso para usar Claude desde esta página." : "No se pudieron generar preguntas válidas. Inténtalo de nuevo."; b.disabled = false; }
    });

  // Genera preguntas nuevas con Claude y las valida antes de usarlas
  async function genQuestions(d) {
    if (!sampleFn) throw { code: "not_granted" };
    const doms = d ? [DBY[d]] : DOMAINS;
    const brief = doms.map(x => `Domain ${x.n} — ${x.en} (${x.w}%)\nObjectives: ${x.obj.join("; ")}\nKey guidance: ${x.key.map(strip).join(" ")}`).join("\n\n");
    const examples = shuffle(BANK.filter(q => !d || q.d === d)).slice(0, 2).map(q => JSON.stringify({ d: q.d, q: q.q, o: q.o, a: q.a, x: q.x })).join("\n");
    const prompt = `You write practice questions for the Claude Certified Associate – Foundations exam (CCAO-F), aimed at non-technical business users of Claude. Write 8 NEW questions about the domain(s) below. Base every answer only on the guidance given; do not invent product features, prices or plan details.

${brief}

Style rules:
- Each question is a short realistic workplace scenario that asks for the MOST appropriate, BEST, or FIRST action.
- 6 single-answer questions with exactly 4 options, and 2 "(Select TWO.)" questions with exactly 5 options and 2 correct answers.
- Distractors must be plausible and partly reasonable (e.g. asking Claude to double-check itself, switching models, repeating the instruction), not obviously wrong.
- All options in a question must have similar length. The correct option must NOT be the longest one more often than chance.
- Questions and options in English. The explanation "x" in Spanish, one or two sentences, saying why the answer is right and why the most tempting distractor is wrong.
- Do not repeat these existing questions:
${examples}

Reply with only a JSON array of 8 objects: {"d": domain number, "q": string, "o": [options], "a": [indexes of correct options, 0-based], "x": string}.`;
    const arr = await sampleFn.json(prompt, { modelTier: "default", cache: false });
    const ok = (Array.isArray(arr) ? arr : []).filter(q => q && typeof q.q === "string" && Array.isArray(q.o) && q.o.length >= 4 && q.o.length <= 5 && q.o.every(o => typeof o === "string" && o.trim())
      && Array.isArray(q.a) && q.a.length >= 1 && q.a.length <= 2 && q.a.every(k => Number.isInteger(k) && k >= 0 && k < q.o.length) && new Set(q.a).size === q.a.length && DBY[+q.d])
      .map((q, i) => ({ id: "g" + Date.now() + i, d: +q.d, q: q.q + (q.a.length > 1 && !/select two/i.test(q.q) ? " (Select TWO.)" : ""), o: q.o, a: q.a, x: String(q.x || ""), gen: true }));
    if (ok.length < 3) throw { code: "invalid" };
    return ok;
  }

  function runSim(mode, pool) {
    // Baraja preguntas y opciones para que la letra correcta no siga ningún patrón
    const qs = shuffle(pool.map(q => {
      const perm = shuffle(q.o.map((_, j) => j));
      return Object.assign({}, q, { o: perm.map(j => q.o[j]), a: q.a.map(k => perm.indexOf(k)) });
    }));
    const gen = ++simGen;
    const ans = qs.map(() => []), checked = qs.map(() => false), flag = qs.map(() => false);
    let cur = 0, end = Date.now() + qs.length * 2 * 60000, finished = false;
    main.innerHTML = `<section class="panel"><div class="sim-top"><span class="eyebrow" id="sq"></span><span class="mono" id="stime"></span></div>
      <div class="dots" id="sdots"></div><div id="sbody" class="wbody"></div>
      <div class="chips"><button class="btn ghost" id="sprev">← Anterior</button><button class="btn ghost" id="sflag">Marcar para revisar</button><button class="btn" id="snext">Siguiente →</button><button class="btn ghost" id="sfin">Terminar y corregir</button></div>
      <p class="hint" id="sfinc" hidden>¿Seguro? Te quedan <b id="sleft"></b> preguntas sin responder. <button class="btn" id="sfinok">Sí, corregir</button> <button class="btn ghost" id="sfinno">Seguir</button></p></section>`;
    const $ = s => main.querySelector(s);
    const isRight = i => { const a = ans[i].slice().sort().join(), b = qs[i].a.slice().sort().join(); return a === b; };
    const draw = () => {
      const q = qs[cur], multi = q.a.length > 1;
      $("#sq").textContent = `Pregunta ${cur + 1} de ${qs.length} · Dominio ${q.d}: ${DBY[q.d].es}`;
      $("#sdots").innerHTML = qs.map((_, i) => `<button class="dot ${i === cur ? "cur" : ""} ${ans[i].length ? "ans" : ""} ${flag[i] ? "flag" : ""} ${mode === "practice" && checked[i] ? (isRight(i) ? "ok" : "bad") : ""}" data-q="${i}" aria-label="Pregunta ${i + 1}">${i + 1}</button>`).join("");
      const show = mode === "practice" && checked[cur];
      $("#sbody").innerHTML = `<b style="font-size:1.05rem;max-width:72ch">${esc(q.q)}</b>${multi ? `<span class="pill prog">Select ${q.a.length === 2 ? "TWO" : q.a.length}</span>` : ""}
        <div class="opts" style="display:flex;flex-direction:column;gap:6px">${q.o.map((o, j) => {
          const sel = ans[cur].includes(j), cls = show ? (q.a.includes(j) ? "right" : sel ? "wrong" : "") : "";
          return `<button class="chip ${cls}" data-j="${j}" aria-pressed="${sel}"><b class="mono">${LET[j]}.</b> ${esc(o)}</button>`; }).join("")}</div>
        ${mode === "practice" ? (show ? `<div class="out ${isRight(cur) ? "good" : "warn"}"><b>${isRight(cur) ? "Correcto." : "Incorrecto. Respuesta: " + q.a.slice().sort().map(k => LET[k]).join(" y ") + "."}</b> ${q.x}</div>` : `<div class="chips"><button class="btn" id="scheck" ${ans[cur].length === q.a.length ? "" : "disabled"}>Comprobar</button></div>`) : ""}`;
      $("#sprev").disabled = cur === 0; $("#snext").disabled = cur === qs.length - 1;
      $("#sflag").textContent = flag[cur] ? "Quitar marca" : "Marcar para revisar";
    };
    const tick = () => {
      if (gen !== simGen) { clearInterval(simTimer); return; }
      const left = Math.max(0, end - Date.now()), m = Math.floor(left / 60000), s = Math.floor(left / 1000) % 60;
      $("#stime").textContent = `Tiempo: ${m}:${String(s).padStart(2, "0")}`;
      if (left <= 0) finish();
    };
    function finish() {
      if (finished) return; finished = true; clearInterval(simTimer);
      const byD = {}; DOMAINS.forEach(d => { byD[d.n] = { ok: 0, n: 0 }; });
      qs.forEach((q, i) => { byD[q.d].n++; if (isRight(i)) byD[q.d].ok++; });
      const ok = qs.filter((_, i) => isRight(i)).length, pct = Math.round(ok / qs.length * 100);
      const seen = seenGet(); qs.forEach(q => { if (typeof q.id === "number") seen[q.id] = (seen[q.id] || 0) + 1; }); store.set("seen", seen);
      const hist = store.get("exams", []); hist.push({ date: new Date().toLocaleDateString("es-ES"), pct, n: qs.length, mode, byD: Object.fromEntries(Object.entries(byD).filter(([, v]) => v.n).map(([k, v]) => [k, Math.round(v.ok / v.n * 100)])) }); store.set("exams", hist.slice(-10));
      const wrong = qs.map((q, i) => [q, i]).filter(([, i]) => !isRight(i));
      main.innerHTML = `<section class="panel lesson-head"><span class="eyebrow">Resultado del simulacro${mode === "exam" ? " · modo examen" : ""}</span>
        <div class="score">${ok} / ${qs.length} · ${pct} %</div>
        <p class="hint" style="max-width:72ch">${pct >= 80 ? "Buen nivel. Repasa las preguntas falladas y repite el simulacro en modo examen antes de apuntarte." : "Todavía no. Repasa las fichas de los dominios más flojos y vuelve a intentarlo."} Recuerda que la nota real es escalada y que estas preguntas no son las del examen.</p>
        <span class="eyebrow">Aciertos por dominio (como en el informe oficial)</span>
        <div class="doms">${DOMAINS.filter(d => byD[d.n].n).map(d => { const v = byD[d.n], p = Math.round(v.ok / v.n * 100); return `<div class="dom"><span><b>${d.n}. ${d.es}</b><br><span class="hint">${v.ok} de ${v.n} · pesa un ${d.w} % en el examen</span></span><div class="track"><div class="fill" style="width:${p}%;background:${p >= 80 ? "var(--ok)" : "var(--lim)"}"></div></div><span class="pct">${p} %</span></div>`; }).join("")}</div>
        <div class="chips"><button class="btn" data-go="simulacro">Repetir el simulacro</button><button class="btn ghost" data-go="examen">Repasar los dominios</button></div></section>
        ${wrong.length ? `<section class="panel"><h3>Preguntas falladas (${wrong.length})</h3><div class="wbody" id="wrong">${wrong.map(([q, i]) => `<div class="card" data-id="${q.id}"><span class="eyebrow">Dominio ${q.d} · ${DBY[q.d].es}</span><b>${esc(q.q)}</b>
          <ul class="objs">${q.o.map((o, j) => `<li style="${q.a.includes(j) ? "color:var(--ok);font-weight:700" : ans[i].includes(j) ? "color:var(--bad);text-decoration:line-through" : ""}">${LET[j]}. ${esc(o)}</li>`).join("")}</ul>
          <p>${q.x}</p><div class="chips"><button class="chip small" data-why="${i}" hidden>Pídele a Claude que te lo explique</button></div><div class="out cap" hidden></div></div>`).join("")}</div></section>` : ""}`;
      sampleReady.then(s => { if (s) main.querySelectorAll("[data-why]").forEach(b => { b.hidden = false; }); });
      main.querySelectorAll("[data-why]").forEach(b => b.addEventListener("click", async () => {
        const i = +b.dataset.why, q = qs[i], out = b.parentElement.nextElementSibling;
        if (!sampleFn) return; out.hidden = false; out.textContent = "Claude está pensando…"; b.disabled = true;
        try {
          await sampleFn(`Eres un tutor del examen Claude Certified Associate – Foundations. Explica en español, en menos de 140 palabras y con un ejemplo de trabajo, por qué la respuesta correcta es la correcta y por qué la que eligió la persona no lo es. Termina con una regla corta para recordarlo.\n\nPregunta: ${q.q}\nOpciones:\n${q.o.map((o, j) => `${LET[j]}. ${o}`).join("\n")}\nCorrecta: ${q.a.map(k => LET[k]).join(", ")}\nElegida: ${ans[i].map(k => LET[k]).join(", ") || "ninguna"}`, { onText: ({ text }) => { out.innerHTML = md(text); } });
        } catch (e) { out.textContent = e && e.code === "rate_limited" ? "Demasiadas peticiones seguidas. Espera un poco." : "No se pudo obtener la explicación."; }
        finally { b.disabled = false; }
      }));
      window.scrollTo(0, 0);
    }
    main.addEventListener("click", function onSim(e) {
      if (finished || gen !== simGen) { main.removeEventListener("click", onSim); return; }
      const o = e.target.closest(".opts button[data-j]");
      if (o && !(mode === "practice" && checked[cur])) {
        const j = +o.dataset.j, q = qs[cur];
        if (q.a.length > 1) { ans[cur] = ans[cur].includes(j) ? ans[cur].filter(x => x !== j) : ans[cur].concat(j).slice(-q.a.length); }
        else ans[cur] = [j];
        draw(); return;
      }
      const d = e.target.closest("[data-q]"); if (d) { cur = +d.dataset.q; draw(); return; }
      const id = e.target.id;
      if (id === "scheck") { checked[cur] = true; draw(); }
      else if (id === "sprev" && cur > 0) { cur--; draw(); }
      else if (id === "snext" && cur < qs.length - 1) { cur++; draw(); }
      else if (id === "sflag") { flag[cur] = !flag[cur]; draw(); }
      else if (id === "sfin") { const left = ans.filter(a => !a.length).length; if (left) { $("#sleft").textContent = left; $("#sfinc").hidden = false; } else finish(); }
      else if (id === "sfinok") finish();
      else if (id === "sfinno") $("#sfinc").hidden = true;
    });
    draw();
    if (mode === "exam") { tick(); simTimer = setInterval(tick, 1000); } else $("#stime").textContent = "Modo práctica";
  }

  document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { if (location.hash === "#" + b.dataset.go) route(); else location.hash = b.dataset.go; window.scrollTo(0, 0); } });
  document.getElementById("goFichas").addEventListener("click", () => { location.hash = "fichas"; window.scrollTo(0, 0); });

  const route = () => {
    let h = location.hash.slice(1);
    if (/^l\d+$/.test(h)) h = "cap-" + h;
    if (!h) h = store.get("route", "ruta");
    clearInterval(simTimer); simGen++;
    if (h === "fichas") renderFichas();
    else if (h === "examen") renderExamen();
    else if (h === "simulacro") renderSim();
    else if (h === "ruta") renderRuta();
    else {
      const m = /^([a-z0-9]+)-l(\d+)$/.exec(h);
      if (m && CBY[m[1]]) renderLesson(CBY[m[1]], +m[2]); else { h = "ruta"; renderRuta(); }
    }
    store.set("route", h);
  };
  window.addEventListener("hashchange", route);
  progress(); route();
})();
</script>
