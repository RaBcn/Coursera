<title>Laboratorio de IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cuaderno de laboratorio. Índice de lecciones a la izquierda, lección activa a la derecha.
   Metáfora central: el continuo capacidad (verde azulado) → limitación (ámbar). */
:root {
  --bg: #EDF1F2;
  --surface: #FFFFFF;
  --ink: #15242B;
  --muted: #56676F;
  --line: #D0DADE;
  --cap: #0E6E6A;
  --cap-soft: #DCEFEC;
  --lim: #A9600D;
  --lim-soft: #F7E9D6;
  --ok: #1D7A3E;
  --bad: #B3362B;
  --card: #FFFDF6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171A; --surface: #172227; --ink: #E3ECEE; --muted: #94A6AD; --line: #2B3A41;
    --cap: #45BDB4; --cap-soft: #173A38; --lim: #E6A75A; --lim-soft: #3D2C17;
    --ok: #5CC985; --bad: #F07A6E; --card: #1C2A2F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171A; --surface: #172227; --ink: #E3ECEE; --muted: #94A6AD; --line: #2B3A41;
  --cap: #45BDB4; --cap-soft: #173A38; --lim: #E6A75A; --lim-soft: #3D2C17;
  --ok: #5CC985; --bad: #F07A6E; --card: #1C2A2F; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.6rem, 3.2vw, 2.2rem); font-weight: 700; }
h2 { font-size: clamp(1.35rem, 2.6vw, 1.75rem); font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--cap); outline-offset: 2px; }
a { color: var(--cap); }
.eyebrow { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; }
header.top .sub { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.top-right { display: flex; flex-direction: column; gap: 10px; min-width: 220px; flex: 0 1 300px; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress .bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cap), var(--lim)); transition: width .4s ease; }
.progress .lbl { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
nav.lessons { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 2px; }
nav.lessons button {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center;
  text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; color: var(--ink);
}
nav.lessons button .n { font-family: var(--font-mono); font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
nav.lessons button .t { font-size: .93rem; line-height: 1.3; }
nav.lessons button .s { font-size: .8rem; color: var(--ok); font-weight: 700; }
nav.lessons button:hover { background: var(--surface); }
nav.lessons button[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--cap); }
nav.lessons .sep { height: 1px; background: var(--line); margin: 6px 10px; }

main { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.lesson-head { display: flex; flex-direction: column; gap: 8px; }
.lesson-head .en { font-family: var(--font-mono); font-size: .82rem; color: var(--muted); }
.head-row { display: flex; gap: 12px 18px; flex-wrap: wrap; align-items: center; font-size: .9rem; }

ul.ideas { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
ul.ideas li { padding-left: 22px; position: relative; max-width: 72ch; }
ul.ideas li::before { content: ""; position: absolute; left: 4px; top: .62em; width: 8px; height: 8px; border-radius: 2px; background: var(--cap); }
.terms { display: flex; flex-wrap: wrap; gap: 8px; }
.term { font-size: .85rem; border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; background: var(--bg); }
.term b { font-family: var(--font-mono); font-weight: 600; font-size: .8rem; }
.hint { color: var(--muted); font-size: .92rem; max-width: 70ch; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 13px; text-align: left; }
.chip:hover { border-color: var(--cap); }
.chip[aria-pressed="true"] { border-color: var(--cap); background: var(--cap-soft); }
.chip.right { border-color: var(--ok); }
.chip.wrong { border-color: var(--bad); }
.chip.small { padding: 5px 10px; font-size: .86rem; }
.btn { border: 0; background: var(--cap); color: var(--surface); border-radius: 9px; padding: 9px 16px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--cap); border: 1.5px solid var(--cap); }
.btn.done { background: var(--ok); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.out { border-radius: 10px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); max-width: 75ch; }
.out.good { border-color: var(--ok); }
.out.warn { border-color: var(--lim); background: var(--lim-soft); }
.out.cap { border-color: var(--cap); background: var(--cap-soft); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); min-width: 0; }
.mono { font-family: var(--font-mono); font-size: .88rem; }
.tag-ok { color: var(--ok); font-weight: 700; }
.tag-bad { color: var(--bad); font-weight: 700; }
textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea { min-height: 110px; resize: vertical; }
.wbody { display: flex; flex-direction: column; gap: 12px; }

.continuum { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.continuum button { border: 0; padding: 8px 2px; font-size: .78rem; border-radius: 6px; background: var(--bg); color: var(--ink); outline: 1.5px solid var(--line); outline-offset: -1.5px; }
.continuum button:nth-child(1) { background: var(--cap-soft); }
.continuum button:nth-child(5) { background: var(--lim-soft); }
.continuum button[aria-pressed="true"] { outline: 2.5px solid var(--ink); outline-offset: -2.5px; font-weight: 700; }
.continuum button.sugg { box-shadow: inset 0 -4px 0 var(--cap); }
.scale-lbl { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.scale-lbl span:first-child { color: var(--cap); }
.scale-lbl span:last-child { color: var(--lim); }

.hunt { font-size: 1.05rem; line-height: 2; max-width: 70ch; }
.hunt .tok { cursor: pointer; border-radius: 4px; padding: 1px 3px; border-bottom: 1.5px dashed var(--line); }
.hunt .tok:hover { background: var(--bg); }
.hunt .tok.on { background: var(--lim-soft); border-bottom-color: var(--lim); }
.hunt.revealed .tok.risk { background: var(--lim-soft); border-bottom: 2px solid var(--lim); }
.hunt.revealed .tok.risk.on::after { content: " ✓"; color: var(--ok); font-weight: 700; }
.hunt.revealed .tok.on:not(.risk) { background: transparent; text-decoration: line-through; }

.corpus { display: flex; flex-wrap: wrap; gap: 6px; }
.corpus span { font-family: var(--font-mono); font-size: .82rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.sentence { font-family: var(--font-mono); font-size: 1.15rem; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); min-height: 56px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sentence .w { padding: 2px 7px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); }
.sentence .w.last { border-color: var(--cap); background: var(--cap-soft); }
.probs { display: flex; flex-direction: column; gap: 6px; }
.prob { display: grid; grid-template-columns: 110px 1fr 54px; gap: 10px; align-items: center; font-family: var(--font-mono); font-size: .85rem; }
.prob .track { height: 14px; background: var(--bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.prob .fill { height: 100%; background: var(--cap); transition: width .3s ease; }
.prob .pct { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.ctrl { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.ctrl label { display: flex; gap: 8px; align-items: center; font-size: .92rem; }
.ctrl input[type=range] { accent-color: var(--cap); width: 150px; }

/* Embeddings */
.emb { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.emb svg { width: 100%; max-width: 100%; height: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; cursor: crosshair; touch-action: manipulation; }
.emb svg text { font-family: var(--font-mono); font-size: 9px; fill: var(--muted); }
.emb svg .doc { fill: var(--cap); }
.emb svg .doc.near { fill: var(--lim); }
.emb svg .q { fill: var(--ink); }
.emb svg .lnk { stroke: var(--lim); stroke-width: 1.5; stroke-dasharray: 3 3; }
.emb svg .ax { stroke: var(--line); stroke-width: 1; }
.emb svg .dl { font-size: 8.5px; fill: var(--ink); }
.nn { display: flex; flex-direction: column; gap: 6px; }
.nn .row { display: grid; grid-template-columns: 1fr 64px; gap: 8px; font-size: .92rem; padding: 6px 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.nn .row span:last-child { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }

/* Ventana de contexto */
.ctxwin { display: flex; flex-direction: column; gap: 6px; }
.msg { font-size: .9rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; grid-template-columns: 34px 1fr; gap: 8px; }
.msg .i { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }
.msg.out-win { opacity: .4; text-decoration: line-through; background: transparent; }
.msg.key { border-color: var(--lim); }
.msg.pinned { border-color: var(--cap); background: var(--cap-soft); }
.winbox { border: 2px solid var(--cap); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.winbox .eyebrow { color: var(--cap); }

/* Test de memoria */
.flash { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; text-align: center; padding: 28px 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); min-height: 110px; display: flex; align-items: center; justify-content: center; }
.bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 130px; padding: 8px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.bars div { background: var(--cap); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; }
.bars div.mid { background: var(--lim); }
.bars-lbl { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; font-family: var(--font-mono); font-size: .68rem; color: var(--muted); text-align: center; padding: 0 8px; }

/* Pasos revelables */
.steps { display: flex; flex-direction: column; gap: 8px; }
.step { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 4px; }
.step.lit { border-color: var(--lim); }
.step.goal { border-color: var(--bad); }
.step.fix { border-color: var(--ok); }
.quote { font-family: var(--font-mono); font-size: .86rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }

/* Ficha de examen */
.ficha { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;
  background-image: repeating-linear-gradient(var(--card) 0 27px, var(--line) 27px 28px); background-position: 0 44px; }
.ficha .fh { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; background: var(--card); }
.ficha dl { margin: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 14px; }
.ficha dt { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--cap); padding-top: 3px; }
.ficha dd { margin: 0; font-size: .95rem; }
.ficha .rec { border-top: 1.5px solid var(--lim); padding-top: 8px; font-weight: 700; background: var(--card); }
.fichas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }

/* Chat */
.chatlog { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; padding: 4px; }
.bub { max-width: 85%; padding: 10px 13px; border-radius: 12px; white-space: pre-wrap; font-size: .95rem; }
.bub.me { align-self: flex-end; background: var(--cap); color: var(--surface); border-bottom-right-radius: 3px; }
.bub.ai { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
.bub.ai.thinking { color: var(--muted); font-style: italic; }
.chatform { display: flex; gap: 8px; }
.chatform input { flex: 1; min-width: 0; }

.q { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; padding-top: 0; }
.q .opts { display: flex; flex-direction: column; gap: 6px; }
.q .opts .chip { width: 100%; }
.done-banner { display: flex; gap: 10px; align-items: center; font-weight: 700; color: var(--ok); }
.score { font-family: var(--font-display); font-size: 2rem; font-weight: 700; }

@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav.lessons { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  nav.lessons button { grid-template-columns: auto auto; flex: 0 0 auto; background: var(--surface); border: 1px solid var(--line); }
  nav.lessons button .t { display: none; }
  nav.lessons button.fichas-nav .t { display: inline; }
  nav.lessons .sep { display: none; }
  nav.lessons button[aria-current="true"] { box-shadow: inset 0 -3px 0 var(--cap); }
  .panel { padding: 16px; }
  .prob { grid-template-columns: 84px 1fr 46px; }
  .emb { grid-template-columns: minmax(0, 1fr); }
  .ficha dl { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .ficha dd { margin-bottom: 6px; }
  .fichas-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Curso · AI capabilities and limitations</div>
      <h1>Laboratorio de IA</h1>
      <p class="sub">Cada lección del curso, resumida en español, con ejercicios para tocar los conceptos, una ficha para el examen y un tutor al que preguntarle dudas.</p>
    </div>
    <div class="top-right">
      <div class="progress" aria-live="polite">
        <div class="lbl" id="progLbl">0 de 14 lecciones completadas</div>
        <div class="bar"><i id="progBar"></i></div>
      </div>
      <button class="btn ghost" id="goFichas">Ver todas las fichas de examen</button>
    </div>
  </header>

  <div class="layout">
    <nav class="lessons" id="nav" aria-label="Lecciones"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
(function () {
  "use strict";

  const store = {
    get(k, d) { try { const v = localStorage.getItem("labia:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("labia:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  let done = store.get("done", {});

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const strip = s => String(s).replace(/<[^>]+>/g, "");
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const BASE = "https://academy.claude.com/courses/ai-capabilities-and-limitations/";

  // Acceso a Claude desde la página (se activa solo si el visor lo permite)
  let sampleFn = null;
  const sampleReady = (window.claude && window.claude.use) ? window.claude.use("sample").then(s => { sampleFn = s; return s; }).catch(() => null) : Promise.resolve(null);

  // ============ Widgets genéricos ============

  // Continuo: ¿cuánto revisarías?
  function wContinuum(tasks, intro) {
    return el => {
      const LBL = ["Confía", "Revisa por encima", "Revisa", "Verifica", "Alto riesgo"];
      el.innerHTML = `<p class="hint">${intro || "¿Cuánto revisarías el resultado de cada tarea? Elige y compara con la posición sugerida (marcada con una raya debajo)."}</p>` +
        tasks.map((t, i) => `
        <div class="card" data-i="${i}">
          <b>${t[0]}</b>
          <div class="continuum">${LBL.map((l, j) => `<button data-j="${j}" aria-pressed="false">${l}</button>`).join("")}</div>
          <div class="scale-lbl"><span>zona de capacidad</span><span>zona de limitación</span></div>
          <p class="hint" hidden></p>
        </div>`).join("");
      el.addEventListener("click", e => {
        const b = e.target.closest(".continuum button"); if (!b) return;
        const card = b.closest(".card"), t = tasks[+card.dataset.i], j = +b.dataset.j;
        card.querySelectorAll(".continuum button").forEach(x => { x.setAttribute("aria-pressed", x === b); x.classList.toggle("sugg", +x.dataset.j === t[1]); });
        const p = card.querySelector("p"); p.hidden = false;
        const d = Math.abs(j - t[1]);
        p.innerHTML = `<span class="${d <= 1 ? "tag-ok" : "tag-bad"}">${d === 0 ? "Igual que la sugerida." : d === 1 ? "Muy cerca." : "Bastante lejos de la sugerida."}</span> ${t[2]}`;
      });
    };
  }

  // Clasificador: lee el caso y elige la categoría
  function wClassify(cats, cases, intro) {
    return el => {
      el.innerHTML = `<p class="hint">${intro}</p>` + cases.map((s, i) => `
        <div class="card" data-i="${i}">
          <span>${esc(s[1])}</span>
          <div class="chips">${Object.keys(cats).map(k => `<button class="chip small" data-k="${k}">${cats[k]}</button>`).join("")}</div>
          <p class="hint" hidden></p>
        </div>`).join("");
      el.addEventListener("click", e => {
        const b = e.target.closest("button[data-k]"); if (!b) return;
        const card = b.closest(".card"), s = cases[+card.dataset.i], ok = b.dataset.k === s[0];
        card.querySelectorAll("button").forEach(x => x.classList.remove("right", "wrong"));
        b.classList.add(ok ? "right" : "wrong");
        const p = card.querySelector("p"); p.hidden = false;
        p.innerHTML = ok ? `<span class="tag-ok">Correcto: ${cats[s[0]]}.</span> ${s[2]}` : `<span class="tag-bad">No es esa.</span> Vuelve a leerlo y prueba otra.`;
      });
    };
  }

  // Cuaderno: texto guardado en este navegador
  function wNote(key, intro, placeholder) {
    return el => {
      el.innerHTML = `<p class="hint">${intro}</p><textarea id="n_${key}" placeholder="${esc(placeholder)}"></textarea><p class="hint" id="s_${key}"></p>`;
      const ta = el.querySelector("textarea"), s = el.querySelector("#s_" + key);
      ta.value = store.get(key, "");
      ta.addEventListener("input", () => { store.set(key, ta.value); s.textContent = "Guardado en este navegador."; });
    };
  }

  // ============ Widgets específicos ============

  const PROPS = {
    ntp: { name: "Predicción del siguiente token", en: "Next Token Prediction", q: "¿De dónde salen las respuestas?", s: "genera lo que suena bien" },
    know: { name: "Conocimiento", en: "Knowledge", q: "¿Qué sabe realmente el modelo?", s: "lo que leyó al entrenarse" },
    mem: { name: "Memoria de trabajo", en: "Working Memory", q: "¿A qué está prestando atención ahora?", s: "atiende a lo que tiene delante" },
    steer: { name: "Dirigibilidad", en: "Steerability", q: "¿Cuánto control tienes tú?", s: "sigue la instrucción más visible" }
  };
  const COLL = {
    "know+ntp": { course: true, t: "Citas y datos inventados", d: "Al modelo le falta el dato (hueco de conocimiento), pero sigue generando algo con forma de cita: título creíble, revista que suena real, autores del campo. No distingue lo que sabe de lo que genera.", f: "Verifica los datos concretos por tu cuenta o usa una herramienta con fuentes (búsqueda, Research) para que recupere documentos reales." },
    "mem+steer": { course: true, t: "Deriva en conversaciones largas", d: "Tus reglas del principio se han desvanecido (salieron de la ventana o reciben menos atención) y el modelo sigue lo que dijiste más recientemente, que va pisando lo anterior.", f: "Vuelve a darle el contexto clave, o abre un chat nuevo con lo esencial al principio." },
    "ntp+steer": { course: false, t: "Cálculos encadenados, mal y con seguridad", d: "En una cadena larga de pasos, un pequeño error temprano se arrastra (deriva de razonamiento) y la predicción sigue escribiendo con el mismo tono seguro.", f: "Pásale el cálculo a una herramienta de ejecución de código y pide resultados intermedios para revisar." },
    "know+steer": { course: false, t: "Premisas falsas aceptadas", d: "Le das una instrucción construida sobre un dato erróneo y el modelo la sigue en lugar de cuestionarla, sobre todo si el tema está en su zona débil (y la complacencia empuja en la misma dirección).", f: "Invítale a llevarte la contraria: «Si alguna premisa es falsa, dímelo antes de seguir»." },
    "know+mem": { course: false, t: "Conflicto entre tu documento y lo que aprendió", d: "Le das un documento actualizado, pero el dato clave está enterrado en medio y el modelo responde con su conocimiento antiguo del entrenamiento.", f: "Pon el documento clave al principio y dile explícitamente que use solo esa fuente." },
    "mem+ntp": { course: false, t: "Huecos rellenados en documentos largos", d: "Un detalle del medio de un documento largo pierde atención y la predicción rellena el hueco con algo plausible pero no exacto.", f: "Trocea el documento en partes y pide citas textuales del original para comprobar." }
  };

  function wProps(full) {
    return el => {
      let sel = [];
      el.innerHTML = `
        <p class="hint">${full ? "Elige dos propiedades para ver qué fallo producen al chocar y cómo arreglarlo." : "Toca una propiedad para ver su pregunta clave. Toca dos para ver qué pasa cuando chocan."}</p>
        <div class="grid2" id="pp"></div>
        <div class="out" id="po">Ninguna seleccionada todavía.</div>`;
      const pp = el.querySelector("#pp"), po = el.querySelector("#po");
      pp.innerHTML = Object.entries(PROPS).map(([k, p]) =>
        `<button class="chip" data-k="${k}" aria-pressed="false"><b>${p.name}</b><br><span class="mono">${p.en}</span><br><span class="hint">${p.s}</span></button>`).join("");
      pp.addEventListener("click", e => {
        const b = e.target.closest("button"); if (!b) return;
        const k = b.dataset.k;
        sel = sel.includes(k) ? sel.filter(x => x !== k) : sel.concat(k).slice(-2);
        pp.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", sel.includes(x.dataset.k)));
        if (sel.length === 0) { po.className = "out"; po.textContent = "Ninguna seleccionada todavía."; return; }
        if (sel.length === 1) { const p = PROPS[sel[0]]; po.className = "out cap"; po.innerHTML = `<b>${p.name}</b>: ${p.q}`; return; }
        const c = COLL[sel.slice().sort().join("+")];
        po.className = "out warn";
        if (!full && !c.course) { po.innerHTML = `<b>${PROPS[sel[0]].name} + ${PROPS[sel[1]].name}.</b> Este choque lo verás en la lección 12, «Cuando las propiedades chocan».`; return; }
        po.innerHTML = `<b>Choque: ${c.t}.</b> ${c.d}${full ? `<br><br><b>Arreglo:</b> ${c.f}` : ""}<br><span class="hint">${c.course ? "Ejemplo que da el curso." : "Ejemplo adicional del laboratorio (el curso solo detalla dos parejas)."}</span>`;
      });
    };
  }

  function wSort(el) {
    const items = shuffle([
      ["Filtro de spam de tu correo", "c", "Decide si un correo es spam o no: clasifica algo que ya existe."],
      ["Recomendaciones de vídeos", "c", "Ordena vídeos que ya existen según lo que crees que te gustará."],
      ["Aviso de fraude en tu tarjeta", "c", "Predice si un cargo es sospechoso. No crea contenido."],
      ["Claude redactando un correo", "g", "Escribe un texto nuevo, palabra a palabra."],

      ["Traductor que reescribe un párrafo en inglés", "g", "Los traductores modernos generan el texto nuevo en el otro idioma, token a token."],
      ["Etiquetado de caras en tus fotos", "c", "Reconoce y etiqueta algo que ya está en la foto."]
    ]);

        <div class="chips"><button class="chip small" data-v="g">Genera contenido</button><button class="chip small" data-v="c">Clasifica o predice</button></div>
        <p class="hint" hidden></p>
      </div>`).join("");
    sg.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;

  function wStages(el) {

      2: { h: "Modelo con ajuste fino (asistente)", t: "La capital de Francia es París.", n: "Trata tu texto como una petición y responde. Ese comportamiento es una capa entrenada encima de la etapa 1." }

  function wHunt(el) {
    const parts = [
      ["Según un estudio de "], ["la Universidad de Harvard", 1], [" publicado en "], ["2019", 1], [" por "], ["la Dra. Laura Méndez", 1],
      [", "], ["el 67 %", 1], [" de las pymes que usan IA aumentan su productividad. Puedes leerlo en "], ["www.harvard-ia-pymes.org", 1],
      [". "], ["En general, la IA ayuda a automatizar tareas repetitivas", 0], ["."]
    ];
    el.innerHTML = `
      <p class="hint">Este párrafo es un ejemplo inventado, escrito con el tono seguro de una IA. Toca las partes que comprobarías antes de usarlo. Luego pulsa «Ver solución».</p>
      <p class="hunt" id="hp">${parts.map(p => p.length > 1 ? `<span class="tok ${p[1] ? "risk" : ""}" role="button" tabindex="0">${esc(p[0])}</span>` : esc(p[0])).join("")}</p>
      <div class="chips"><button class="btn" id="hr">Ver solución</button><button class="btn ghost" id="hx">Reiniciar</button></div>
      <div class="out" id="ho" hidden></div>`;
    const hp = el.querySelector("#hp"), ho = el.querySelector("#ho");
    const tog = t => { if (!hp.classList.contains("revealed")) t.classList.toggle("on"); };
    hp.addEventListener("click", e => { const t = e.target.closest(".tok"); if (t) tog(t); });
    hp.addEventListener("keydown", e => { const t = e.target.closest(".tok"); if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tog(t); } });
    el.querySelector("#hr").addEventListener("click", () => {
      hp.classList.add("revealed");
      const risks = hp.querySelectorAll(".tok.risk").length, hit = hp.querySelectorAll(".tok.risk.on").length, extra = hp.querySelectorAll(".tok.on:not(.risk)").length;
      ho.hidden = false; ho.className = hit === risks && !extra ? "out good" : "out warn";
      ho.innerHTML = `Has marcado ${hit} de ${risks} datos específicos.${extra ? " La frase general no hace falta comprobarla tanto: es una idea común, no un dato concreto." : ""}<br>Institución, fecha, nombre, porcentaje y URL son lo más fácil de inventar. Cuanto más preciso es un dato, más merece una comprobación.`;
    });
    el.querySelector("#hx").addEventListener("click", () => { hp.classList.remove("revealed"); hp.querySelectorAll(".tok").forEach(t => t.classList.remove("on")); ho.hidden = true; });
  }

  function wMarkov(el) {
    let corpus = ["el gato come pescado", "el gato duerme mucho", "el gato come mucho", "el perro come carne", "el perro duerme poco", "la niña come fruta", "la niña duerme poco", "el perro corre mucho"];
    let counts = {}, sent = [], temp = 1, topk = 0;
    const START = "·inicio·", END = "·fin·";
    const train = () => {
      counts = {};
      corpus.forEach(s => { const w = [START].concat(s.toLowerCase().split(/\s+/).filter(Boolean), [END]);
        for (let i = 0; i < w.length - 1; i++) { (counts[w[i]] = counts[w[i]] || {}); counts[w[i]][w[i + 1]] = (counts[w[i]][w[i + 1]] || 0) + 1; } });
    };
    const dist = () => {
      const prev = sent.length ? sent[sent.length - 1] : START;
      let entries = Object.entries(counts[prev] || {}).sort((a, b) => b[1] - a[1]);
      if (topk > 0) entries = entries.slice(0, topk);
      const ws = entries.map(([w, c]) => [w, Math.pow(c, 1 / temp)]);
      const tot = ws.reduce((a, b) => a + b[1], 0) || 1;
      return { prev, list: ws.map(([w, v]) => [w, v / tot]) };
    };
    el.innerHTML = `
      <p class="hint">Un modelo muy simple que solo mira la palabra anterior. Cuenta en las frases de entrenamiento qué palabra suele venir después y elige la siguiente al azar según esas probabilidades. Es la misma idea que el autocompletado del móvil.</p>
      <div class="card"><span class="eyebrow">Frases de entrenamiento</span><div class="corpus" id="mc"></div>
        <div class="chips"><input type="text" id="mi" placeholder="Añade una frase, p. ej.: el gato corre poco" style="flex:1;min-width:0"><button class="btn ghost" id="ma">Entrenar con ella</button></div></div>
      <div class="sentence" id="ms" aria-live="polite"></div>
      <div class="card"><span class="eyebrow" id="mh"></span><div class="probs" id="mp"></div></div>
      <div class="ctrl">
        <button class="btn" id="mg">Generar siguiente palabra</button>
        <button class="btn ghost" id="mr">Empezar de nuevo</button>
        <label for="mt">Temperatura <input type="range" id="mt" min="0.2" max="3" step="0.1" value="1"> <span class="mono" id="mtv">1.0</span></label>
        <label for="mk">Top-k <input type="range" id="mk" min="0" max="4" step="1" value="0"> <span class="mono" id="mkv">todas</span></label>
      </div>
      <div class="out" id="mn">Pulsa «Generar siguiente palabra» varias veces y mira cómo cambian las barras.</div>`;
    const $ = s => el.querySelector(s);
    const render = () => {
      $("#mc").innerHTML = corpus.map(s => `<span>${esc(s)}</span>`).join("");
      const finished = sent[sent.length - 1] === END;
      $("#ms").innerHTML = sent.length ? sent.filter(w => w !== END).map((w, i, a) => `<span class="w ${i === a.length - 1 ? "last" : ""}">${esc(w)}</span>`).join("") + (finished ? ` <span class="mono" style="color:var(--muted)">(fin de frase)</span>` : "") : `<span class="mono" style="color:var(--muted)">La frase aparecerá aquí…</span>`;
      const d = dist();
      $("#mh").textContent = d.prev === START ? "¿Con qué palabra suelen empezar las frases?" : `Después de «${d.prev}», ¿qué viene?`;
      $("#mp").innerHTML = finished ? `<p class="hint">Frase terminada. Pulsa «Empezar de nuevo».</p>` :
        d.list.map(([w, p]) => `<div class="prob"><span>${esc(w === END ? "(fin)" : w)}</span><div class="track"><div class="fill" style="width:${(p * 100).toFixed(1)}%"></div></div><span class="pct">${Math.round(p * 100)} %</span></div>`).join("") || `<p class="hint">Esta palabra no aparece seguida de nada en el entrenamiento.</p>`;
      $("#mg").disabled = finished || !d.list.length;
    };
    $("#mg").addEventListener("click", () => {
      const d = dist(); let r = Math.random(), pick = d.list[d.list.length - 1][0];
      for (const [w, p] of d.list) { if ((r -= p) <= 0) { pick = w; break; } }
      sent.push(pick); render();
      $("#mn").innerHTML = `Ha elegido ${pick === END ? "el final de la frase" : `«${esc(pick)}»`} con un ${Math.round(d.list.find(x => x[0] === pick)[1] * 100)} % de probabilidad. No ha «pensado» la respuesta: ha tirado un dado con esas probabilidades.`;
    });
    $("#mr").addEventListener("click", () => { sent = []; render(); $("#mn").textContent = "Frase nueva. Con la misma entrada, cada vez puede salir algo distinto: eso es el muestreo."; });
    $("#ma").addEventListener("click", () => { const v = $("#mi").value.trim(); if (!v) return; corpus.push(v); $("#mi").value = ""; train(); sent = []; render(); $("#mn").textContent = "Reentrenado. Fíjate en cómo han cambiado las probabilidades."; });
    $("#mi").addEventListener("keydown", e => { if (e.key === "Enter") $("#ma").click(); });
    $("#mt").addEventListener("input", e => { temp = +e.target.value; $("#mtv").textContent = temp.toFixed(1); render();
      $("#mn").textContent = temp < 0.8 ? "Temperatura baja: la palabra más probable gana casi siempre. Más predecible, más repetitivo." : temp > 1.4 ? "Temperatura alta: las opciones raras ganan peso. Más variado, pero más riesgo de salir del camino." : "Temperatura 1: se usan las probabilidades tal como salen del recuento."; });
    $("#mk").addEventListener("input", e => { topk = +e.target.value; $("#mkv").textContent = topk ? topk : "todas"; render();
      $("#mn").textContent = topk ? `Top-k = ${topk}: solo puede elegir entre las ${topk} palabras más probables.` : "Top-k desactivado: puede elegir cualquier palabra vista."; });
    train(); render();
  }

  function wMarkovCompare(el) {
    el.innerHTML = `<div class="grid2">
      <div class="card"><h3>Cadena de Markov</h3><p>Mira solo la palabra anterior. Las probabilidades salen de contar.</p></div>
      <div class="card"><h3>Modelo de lenguaje (como Claude)</h3><p>Mira todo el texto que tiene delante (la ventana de contexto) y calcula las probabilidades con una red neuronal enorme.</p></div>
    </div>
    <div class="out cap">En lo que se parecen: los dos acaban <b>muestreando de una distribución de probabilidad</b>. Por eso un LLM escribe con fluidez y por eso a veces se inventa cosas. La técnica de predecir la siguiente palabra tiene más de un siglo.</div>`;
  }

  // L7: explorador de embeddings
  function wEmbed(el) {
    const DOCS = [
      ["Receta de pollo al horno", .35, .92], ["Cómo cuidar a tu gato", .92, .18], ["Qué comen los gatos", .86, .78],
      ["Historia del Imperio romano", .08, .1], ["Menú vegetariano semanal", .06, .86], ["Razas de perros", .88, .07],
      ["Granja de vacas lecheras", .7, .55], ["Impuestos para autónomos", .16, .04]
    ];
    const PRE = [["pienso para perros", .9, .74], ["cena rápida entre semana", .12, .82], ["mascotas", .95, .3]];
    let q = { t: "pienso para perros", x: .9, y: .74 }, k = 3;
    const S = 300, P = 30, X = v => P + v * (S - 2 * P), Y = v => S - P - v * (S - 2 * P);
    el.innerHTML = `
      <p class="hint">Cada documento es un punto según de qué habla. Eje horizontal: cuánto habla de animales. Eje vertical: cuánto habla de comida. Toca el plano para colocar una búsqueda, o elige una de ejemplo.</p>
      <div class="chips" id="ep">${PRE.map((p, i) => `<button class="chip small" data-i="${i}">«${p[0]}»</button>`).join("")}</div>
      <div class="emb">
        <svg id="es" viewBox="0 0 ${S} ${S}" role="img" aria-label="Plano de significados con documentos y la búsqueda"></svg>
        <div class="wbody">
          <label class="ctrl" for="ek">Vecinos más cercanos <input type="range" id="ek" min="1" max="5" value="3"> <span class="mono" id="ekv">3</span></label>
          <div class="nn" id="en"></div>
          <div class="out cap" id="eo"></div>
        </div>
      </div>`;
    const svg = el.querySelector("#es");
    const render = () => {
      const ranked = DOCS.map(d => { const dist = Math.hypot(d[1] - q.x, d[2] - q.y); return { d, dist, sim: Math.max(0, 1 - dist / Math.SQRT2) }; }).sort((a, b) => a.dist - b.dist);
      const near = new Set(ranked.slice(0, k).map(r => r.d[0]));
      let g = `<line class="ax" x1="${P}" y1="${S - P}" x2="${S - P}" y2="${S - P}"/><line class="ax" x1="${P}" y1="${P}" x2="${P}" y2="${S - P}"/>
        <text x="${S - P}" y="${S - 10}" text-anchor="end">animales →</text><text x="8" y="${P - 10}">↑ comida</text>`;
      ranked.slice(0, k).forEach(r => { g += `<line class="lnk" x1="${X(q.x)}" y1="${Y(q.y)}" x2="${X(r.d[1])}" y2="${Y(r.d[2])}"/>`; });
      DOCS.forEach(d => { const nx = X(d[1]), ny = Y(d[2]), right = d[1] > .55;
        g += `<circle class="doc ${near.has(d[0]) ? "near" : ""}" cx="${nx}" cy="${ny}" r="5"/><text class="dl" x="${right ? nx - 8 : nx + 8}" y="${ny + 3}" text-anchor="${right ? "end" : "start"}">${esc(d[0])}</text>`; });
      g += `<rect class="q" x="${X(q.x) - 5}" y="${Y(q.y) - 5}" width="10" height="10" transform="rotate(45 ${X(q.x)} ${Y(q.y)})"/>`;
      svg.innerHTML = g;
      el.querySelector("#en").innerHTML = `<span class="eyebrow">Resultados para «${esc(q.t)}»</span>` + ranked.slice(0, k).map(r => `<div class="row"><span>${esc(r.d[0])}</span><span>${Math.round(r.sim * 100)} %</span></div>`).join("");
      el.querySelector("#eo").innerHTML = q.t === "pienso para perros"
        ? "Fíjate: «Qué comen los gatos» sale entre los primeros aunque no comparte <b>ninguna palabra</b> con «pienso para perros». La búsqueda por significado encuentra cercanía de sentido, no coincidencia de palabras."
        : "Los modelos reales usan alrededor de mil dimensiones en lugar de dos, y sus ejes no tienen nombres que podamos leer. Pero la idea es la misma: significados parecidos quedan cerca. Así funcionan RAG y la búsqueda en tus documentos.";
    };
    svg.addEventListener("click", e => {
      const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * S, sy = (e.clientY - r.top) / r.height * S;
      q = { t: "tu búsqueda", x: Math.min(1, Math.max(0, (sx - P) / (S - 2 * P))), y: Math.min(1, Math.max(0, (S - P - sy) / (S - 2 * P))) }; render();
    });
    el.querySelector("#ep").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const p = PRE[+b.dataset.i]; q = { t: p[0], x: p[1], y: p[2] }; render(); });
    el.querySelector("#ek").addEventListener("input", e => { k = +e.target.value; el.querySelector("#ekv").textContent = k; render(); });
    render();
  }

  // L8: simulador de ventana de contexto
  function wWindow(el) {
    const CAP = 6;
    const CONV = [
      ["Tú", "Regla: responde siempre en inglés.", true],
      ["Claude", "Sure! I'll answer in English."], ["Tú", "Te paso el borrador del informe."], ["Claude", "Got it. Here are my notes…"],
      ["Tú", "Ahora revisa el apartado 2."], ["Claude", "Section 2 looks solid, but…"], ["Tú", "¿Y el presupuesto?"],
      ["Claude", "The budget adds up, except…"], ["Tú", "Vale, cambia el tono a más formal."], ["Claude", "…"], ["Tú", "¿Qué más mejorarías?"], ["Claude", "…"]
    ];
    let n = 4, pinned = false;
    el.innerHTML = `
      <p class="hint">Esta ventana solo cabe ${CAP} mensajes. Añade mensajes y mira qué pasa con la regla del primero. El modelo no avisa cuando algo se cae.</p>
      <div class="chips"><button class="btn" id="wa">Añadir mensaje</button><button class="btn ghost" id="wr">Reiniciar</button>
        <label class="chips" for="wp" style="gap:6px"><input type="checkbox" id="wp"> Guardar la regla como instrucción fija (proyecto)</label></div>
      <div class="grid2"><div class="ctxwin" id="wl"></div><div class="wbody"><div class="winbox" id="wb"></div><div class="out" id="wo"></div></div></div>`;
    const render = () => {
      const msgs = CONV.slice(0, n), start = Math.max(0, msgs.length - CAP);
      el.querySelector("#wl").innerHTML = `<span class="eyebrow">Conversación completa</span>` + msgs.map((m, i) => `<div class="msg ${i < start ? "out-win" : ""} ${m[2] ? "key" : ""}"><span class="i">${i + 1}</span><span><b>${m[0]}:</b> ${esc(m[1])}</span></div>`).join("");
      const inWin = msgs.slice(start);
      const ruleIn = pinned || start === 0;
      el.querySelector("#wb").innerHTML = `<span class="eyebrow">Lo que el modelo ve ahora (ventana de contexto)</span>` +
        (pinned ? `<div class="msg pinned"><span class="i">fija</span><span><b>Instrucción del proyecto:</b> responde siempre en inglés.</span></div>` : "") +
        inWin.map((m, i) => `<div class="msg ${m[2] ? "key" : ""}"><span class="i">${start + i + 1}</span><span><b>${m[0]}:</b> ${esc(m[1])}</span></div>`).join("");
      const wo = el.querySelector("#wo");
      wo.className = ruleIn ? "out good" : "out warn";
      wo.innerHTML = ruleIn ? `Próxima respuesta: <span class="mono">“Sure, here's a more formal version…”</span><br>La regla está dentro de la ventana, así que se cumple.`
        : `Próxima respuesta: <span class="mono">“¡Claro! Aquí tienes una versión más formal…”</span><br>La regla se ha caído de la ventana sin avisar y el modelo ha vuelto al español. Eso es el <b>precipicio</b> de la memoria de trabajo: funciona hasta que deja de funcionar.`;
      el.querySelector("#wa").disabled = n >= CONV.length;
    };
    el.querySelector("#wa").addEventListener("click", () => { n = Math.min(CONV.length, n + 1); render(); });
    el.querySelector("#wr").addEventListener("click", () => { n = 4; render(); });
    el.querySelector("#wp").addEventListener("change", e => { pinned = e.target.checked; render(); });
    render();
  }

  // L9: test de memoria (efecto de posición serial)
  function wMemory(el) {
    const WORDS = ["mesa", "río", "lápiz", "nube", "caballo", "tren", "limón", "puerta", "guitarra", "sal", "montaña", "reloj"];
    const hits = new Array(12).fill(0); let runs = 0, timer = null;
    el.innerHTML = `
      <p class="hint">Verás 12 palabras, una cada segundo. Después escribe todas las que recuerdes, en cualquier orden. Repítelo varias veces para ver la curva.</p>
      <div class="flash" id="mf" aria-live="polite">Pulsa «Empezar»</div>
      <div class="chips"><button class="btn" id="mgo">Empezar</button></div>
      <div class="wbody" id="mrec" hidden><textarea id="mta" placeholder="Escribe las palabras que recuerdes, separadas por espacios o comas"></textarea><div class="chips"><button class="btn" id="mok">Comprobar</button></div></div>
      <div class="wbody" id="mres" hidden>
        <span class="eyebrow" id="mrl"></span>
        <div class="bars" id="mb"></div><div class="bars-lbl">${WORDS.map((_, i) => `<span>${i + 1}</span>`).join("")}</div>
        <div class="out cap" id="mo"></div>
      </div>`;
    const $ = s => el.querySelector(s);
    $("#mgo").addEventListener("click", () => {
      clearInterval(timer); $("#mrec").hidden = true; $("#mgo").disabled = true; let i = 0;
      $("#mf").textContent = WORDS[0];
      timer = setInterval(() => { i++; if (i < WORDS.length) $("#mf").textContent = WORDS[i]; else { clearInterval(timer); $("#mf").textContent = "¿Cuáles recuerdas?"; $("#mrec").hidden = false; $("#mta").value = ""; $("#mta").focus(); $("#mgo").disabled = false; $("#mgo").textContent = "Repetir"; } }, 1000);
    });
    $("#mok").addEventListener("click", () => {
      const said = new Set($("#mta").value.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split(/[\s,;.]+/).filter(Boolean));
      const got = WORDS.map(w => said.has(w.normalize("NFD").replace(/[̀-ͯ]/g, "")));
      runs++; got.forEach((g, i) => { if (g) hits[i]++; });
      $("#mres").hidden = false; $("#mrec").hidden = true;
      $("#mrl").textContent = `Recuerdo por posición · ${runs} ${runs === 1 ? "intento" : "intentos"} · esta vez: ${got.filter(Boolean).length} de 12`;
      $("#mb").innerHTML = hits.map((h, i) => `<div class="${i >= 3 && i <= 8 ? "mid" : ""}" style="height:${(h / runs) * 100}%" title="${WORDS[i]}: ${h} de ${runs}"></div>`).join("");
      $("#mo").innerHTML = "Lo normal es recordar mejor las primeras (primacía) y las últimas (recencia), y olvidar las del medio (en ámbar). Es el <b>efecto de posición serial</b>. Los modelos de lenguaje muestran lo mismo: en un estudio de Stanford de 2023, la precisión bajaba más de un 30 % cuando el dato clave estaba en medio del contexto. Regla práctica: pon lo importante al principio y repítelo al final.";
    });
  }

  // L13: chequeo de confianza calibrada
  function wCheck(el) {
    const Q = [
      ["ntp", "¿El tema es camino trillado o territorio raro?", ["Trillado", "Algo raro", "Muy raro o con muchos datos concretos"], ["", "Comprueba los datos concretos.", "Verifica nombres, fechas, cifras y citas uno a uno, o usa una herramienta con fuentes."]],
      ["know", "¿Es estable o depende de cosas recientes o locales?", ["Estable", "Puede haber cambiado", "Reciente, local o posterior al corte"], ["", "Asume que puede estar desactualizado.", "Activa la búsqueda web o dale tú los documentos."]],
      ["mem", "¿Cuánto material o conversación implica?", ["Cabe holgado", "Bastante largo", "Muy largo o de otra sesión"], ["", "Pon lo importante al principio.", "Trocea el trabajo, usa un proyecto o empieza un chat nuevo con un resumen."]],
      ["steer", "¿Tus instrucciones son concretas y comprobables?", ["Sí, concretas", "Algo abstractas", "Muchos pasos o abstractas"], ["", "Añade el objetivo, no solo el formato.", "Pide resultados intermedios para revisar y di el objetivo explícitamente."]]
    ];
    const ans = {};
    el.innerHTML = `<p class="hint">El curso lo resume así: antes de delegar una tarea, haz un chequeo rápido. Escribe una tarea tuya y responde las cuatro preguntas.</p>
      <input type="text" id="ct" placeholder="Ej.: preparar el resumen mensual de ventas para dirección">` +
      Q.map((q, i) => `<div class="card" data-i="${i}"><b>${PROPS[q[0]].name}</b><span>${q[1]}</span><div class="continuum" style="grid-template-columns:repeat(3,1fr)">${q[2].map((o, j) => `<button data-j="${j}" aria-pressed="false">${o}</button>`).join("")}</div></div>`).join("") +

    el.addEventListener("click", e => {
      const b = e.target.closest(".continuum button"); if (!b) return;
      const card = b.closest(".card"), i = +card.dataset.i;

      const tips = Q.map((q, k) => q[3][ans[k]] ? `<li><b>${PROPS[q[0]].name}:</b> ${q[3][ans[k]]}</li>` : "").join("");

  function wExam(el) {

    }
  }

        { q: "Si subes la temperatura…", o: ["Siempre elige la palabra más probable", "Las palabras poco probables ganan peso", "El modelo aprende más rápido"], a: 1, w: "Más temperatura, más variedad y más riesgo." },
        { q: "¿En qué se parecen una cadena de Markov y Claude?", o: ["Usan la misma red neuronal", "Los dos muestrean la siguiente palabra de una distribución de probabilidad", "Los dos buscan en una base de datos"], a: 1, w: "El último paso es el mismo; cambia cómo se calcula la distribución." }

    { id: 8, t: "Memoria de trabajo", en: "Working Memory", slug: "working-memory",

        "Cuando se llena, algo se cae (normalmente lo más antiguo) y <b>sin avisar</b>. Entre sesiones la ventana se vacía, salvo que una función como la memoria o un CLAUDE.md guarde algo.",
        "Al contrario que las otras propiedades, esta tiene un <b>precipicio</b>: funciona hasta que deja de funcionar.",
        "Dentro de la ventana, el contexto es palanca: dale una guía de estilo y la aplica al momento. Pero hay efecto <b>perdido en el medio</b>: lo del centro de un texto muy largo pesa menos.",

      terms: [["Context window", "ventana de contexto"], ["Silent truncation", "truncación silenciosa"], ["Lost in the middle", "perdido en el medio"], ["Compaction", "compactación"], ["Front-loading", "poner lo importante primero"]],

        "<b>Efecto de posición serial</b>: recordamos mejor lo primero (primacía) y lo último (recencia). Lo del medio se pierde. Es una curva en U.",
        "Los modelos hacen lo mismo: en un estudio de Stanford de 2023, la precisión cayó más de un 30 % con el dato clave en el medio del contexto.",
        "Regla práctica: las instrucciones importantes, al principio y repetidas al final. Selecciona sin piedad, coloca con estrategia y repite lo que importa."

      terms: [["Serial position effect", "efecto de posición serial"], ["Primacy / Recency", "primacía / recencia"], ["U-shaped curve", "curva en U"], ["Context engineering", "ingeniería de contexto"]],
      ficha: [["Efecto", "Serial position effect: curva en U de recuerdo."], ["Primacía", "Lo del principio se recuerda mejor."], ["Recencia", "Lo del final también."], ["En LLMs", "Stanford 2023: más del 30 % menos de precisión con el dato en medio."], ["Regla", "Instrucción clave al principio y repetida al final."]],

        { q: "«Dale todo el contexto posible y responderá mejor.» ¿Es cierto?", o: ["Siempre", "No siempre: cada añadido empuja otras cosas hacia el medio", "Nunca"], a: 1, w: "Es la tensión central de la ingeniería de contexto." }

        "Zona de capacidad: instrucciones cortas, concretas y comprobables («en tabla», «menos de 100 palabras»). Zona de limitación: cadenas largas de razonamiento, peticiones abstractas («sé perspicaz»), precisión numérica.",

        "Arreglos: da el objetivo junto a los pasos, pide resultados intermedios y, si cumple a la letra pero no sirve, repite el <b>objetivo</b>, no la orden. Conecta con <b>Descripción</b> y <b>Delegación</b>."
      ],
      terms: [["Reasoning drift", "deriva de razonamiento"], ["Letter-over-spirit", "letra sobre espíritu"], ["Prompt injection", "inyección de instrucciones"], ["System prompt", "instrucciones del sistema"], ["Structured output", "salida estructurada"]],
      ficha: [["Pregunta", "¿Cuánto control tienes tú?"], ["Capacidad", "Instrucciones cortas, concretas y verificables: formato, longitud, rol."], ["Limitación", "Razonamientos largos, peticiones abstractas, precisión numérica o lógica."], ["Fallos típicos", "Reasoning drift, letter-over-spirit, prompt injection."], ["Mitigaciones", "System prompts, ejecución de código, razonamiento visible, salidas estructuradas (JSON)."], ["4D", "Potencia y limita la Descripción; también informa la Delegación."]],
      recuerda: "Si cumple a la letra pero no sirve, di el objetivo, no repitas la orden más fuerte.",
      widgets: [["¿Cuánto revisarías?", wContinuum([
        ["«Responde en una tabla de tres columnas»", 0, "Corta, concreta y comprobable de un vistazo."],
        ["«Usa exactamente este formato JSON»", 0, "Las salidas estructuradas reducen el margen de error."],
        ["«Resume en menos de 100 palabras»", 1, "Cumplirá el límite, pero puede cortar justo lo que necesitabas."],
        ["«Sé perspicaz»", 3, "Abstracta: el modelo tiene que adivinar qué quieres decir."],

        ["Nombra el fallo", wClassify(

        [["drift", "En un presupuesto de varios pasos, un error en el paso 2 se arrastra hasta el total final.", "Los pequeños errores se acumulan y el modelo no lo nota."],

         ["letter", "Le pides «sé conciso» y responde con tres palabras que no sirven de nada.", "Repetir «sé conciso» más fuerte no arregla un problema de intención."]],
        "Lee cada caso y elige el fallo de dirigibilidad.")]],
      quiz: [

        { q: "¿Qué instrucción está más en la zona de capacidad?", o: ["«Sé creativo e inteligente»", "«Responde con exactamente 5 viñetas»", "«Resuelve esto en 8 pasos sin mostrar el trabajo»"], a: 1, w: "Corta, concreta y comprobable." },
        { q: "Cumple tu instrucción al pie de la letra pero el resultado no sirve. ¿Qué haces?", o: ["Repetir la instrucción más fuerte", "Explicar el objetivo que hay detrás", "Cambiar de modelo"], a: 1, w: "Letra sobre espíritu se arregla con el objetivo." }
      ] },

          lit: "Tres párrafos sobre las ventajas de la herramienta nueva y la historia de la decisión.",
          goal: "Que cada persona sepa qué cambia en su trabajo y cuándo.", fix: "Añade más detalle. Mi objetivo es que cada persona del equipo sepa qué tiene que hacer distinto, desde qué fecha y a quién preguntar.", lesson: "«Más detalle» se rellenó con información, pero no con la que el equipo necesitaba." }
      ], "Pulsa «Ver siguiente paso» para descubrir qué hace Claude, qué objetivo se perdió y cómo arreglarlo.")]],
      quiz: [
        { q: "¿Por qué «hazlo más corto» puede dar un mal resultado?", o: ["Porque Claude no sabe resumir", "Porque Claude cumple la letra y no conoce tu objetivo", "Porque es una instrucción demasiado larga"], a: 1, w: "Sin el objetivo, decide él qué cortar." },
        { q: "¿Qué mejora más una instrucción vaga?", o: ["Escribirla en mayúsculas", "Añadir el objetivo real", "Repetirla dos veces"], a: 1, w: "El objetivo cierra el hueco entre palabras e intención." },
        { q: "¿Claude infiere la intención que no dices?", o: ["Siempre", "No de forma fiable: sigue lo que está escrito", "Solo en inglés"], a: 1, w: "Por eso hay que decirla." }
      ] },
    { id: 12, t: "Cuando las propiedades chocan", en: "When Properties Collide", slug: "when-properties-collide",
      ideas: [
        "Las cuatro propiedades no actúan solas. La mayoría de los fallos reales son <b>dos propiedades a la vez</b>.",
        "<b>Predicción + Conocimiento</b> = datos y citas inventados. Arreglo: verificar lo concreto o usar fuentes.",
        "<b>Memoria de trabajo + Dirigibilidad</b> = deriva en conversaciones largas. Arreglo: volver a dar el contexto o empezar de nuevo.",
        "Antes de arreglar el prompt, diagnostica qué propiedades intervienen: un problema de conocimiento y uno de memoria pueden parecerse y necesitan arreglos distintos.",
        "Diagnosticar es <b>Discernimiento</b>; si el mismo fallo se repite en un tipo de tarea, eso informa tu <b>Delegación</b>."
      ],
      terms: [["Diagnostic pairs", "parejas de diagnóstico"], ["Re-supply context", "volver a dar el contexto"], ["Invite pushback", "invitar a que te lleve la contraria"], ["Code execution", "ejecución de código"]],
      ficha: [["Idea", "Los fallos reales suelen ser dos propiedades interactuando."], ["NTP + Knowledge", "Citas/datos inventados → verificar o usar fuentes."], ["Working Memory + Steerability", "Deriva en chats largos → re-suministrar contexto o chat nuevo."], ["Arreglos del curso", "Verificar, re-suministrar contexto, pasar a ejecución de código, invitar a llevar la contraria."], ["4D", "Diagnosticar = Discernimiento; patrones repetidos → Delegación."]],
      recuerda: "No es «¿qué se rompió?» sino «¿qué dos cosas chocaron?».",
      widgets: [["Choca dos propiedades", wProps(true)], ["Diagnostica el fallo", wClassify(
        { a: "Predicción + Conocimiento", b: "Memoria + Dirigibilidad", c: "Predicción + Dirigibilidad" },
        [["a", "Le pides tres libros de un historiador local y dos de ellos no existen.", "Genera algo con forma de libro sobre un hueco de conocimiento. Arreglo: verifica o usa búsqueda."],
         ["b", "Al principio pediste tono informal; 40 mensajes después todo sale formal.", "La regla del principio se ha desvanecido y manda lo más reciente. Arreglo: recuérdasela o chat nuevo."],
         ["c", "Le pides calcular un presupuesto con 7 pasos y el total está mal, dicho con total seguridad.", "Deriva de razonamiento con tono seguro. Arreglo: ejecución de código y resultados intermedios. (Pareja propuesta por el laboratorio.)"]],
        "Lee cada caso y elige qué pareja de propiedades ha chocado.")],
        ["Tu ejercicio: diagnóstico de tus fallos", wNote("diag12", "El curso propone recordar 2 o 3 veces que una respuesta de IA te decepcionó y nombrar qué dos propiedades chocaron. Puedes comentarlo con el tutor de abajo.", "Ej.: Me inventó la fecha de una normativa → Predicción + Conocimiento → la próxima vez, con búsqueda web.")]],
      quiz: [
        { q: "¿Qué suele haber detrás de un fallo real de la IA?", o: ["Una sola propiedad", "Dos propiedades interactuando", "Un error de conexión"], a: 1, w: "Por eso hay que nombrar la pareja." },
        { q: "Tras muchos mensajes ignora tus reglas iniciales. ¿Qué pareja es?", o: ["Predicción + Conocimiento", "Memoria de trabajo + Dirigibilidad", "Conocimiento + Dirigibilidad"], a: 1, w: "Contexto que se desvanece + seguir lo más reciente." },
        { q: "¿Por qué diagnosticar antes de cambiar el prompt?", o: ["Porque fallos parecidos pueden necesitar arreglos distintos", "Porque así el modelo aprende", "No hace falta diagnosticar"], a: 0, w: "Si no nombras la causa, estás adivinando." }
      ] },
    { id: 13, t: "Próximos pasos", en: "Next Steps", slug: "next-steps",
      ideas: [
        "Te llevas un modelo mental pequeño y claro: <b>dos etapas</b> de entrenamiento, <b>cuatro propiedades</b> como continuos y los fallos como <b>choques</b> entre ellas.",
        "Las 4D son lo que haces; las 4 propiedades son a lo que respondes. Predicción afina el <b>Discernimiento</b>, memoria de trabajo la <b>Descripción</b> y dirigibilidad la <b>Delegación</b>.",
        "La confianza calibrada no es una actitud, es un <b>hábito</b>: un chequeo rápido antes de delegar y ajustar verificación, contexto y puntos de control.",
        "Siguiente paso recomendado: el curso <b>AI Fluency: Framework and Foundations</b>. Y seguir probando los límites con trabajo real."
      ],
      terms: [["Mental model", "modelo mental"], ["Calibrated trust", "confianza calibrada"], ["4D Framework", "marco de las 4D"]],
      ficha: [["Resumen", "2 etapas de entrenamiento, 4 propiedades-continuo, fallos = choques."], ["Conexión 4D", "NTP → Discernimiento; Working Memory → Descripción; Steerability → Delegación."], ["Hábito", "Antes de delegar: ¿trillado o raro? ¿estable o reciente? ¿cabe en la ventana? ¿instrucciones concretas?"], ["Ajustes", "Más verificación, más contexto, más puntos de control, usar funciones del producto."]],
      recuerda: "Ni confiar ni desconfiar: ubicar la tarea y ajustar los hábitos.",
      widgets: [["Chequeo de confianza calibrada", wCheck], ["Tu compromiso de esta semana", wNote("commit13", "El curso cierra pidiéndote un cambio concreto para esta semana: un paso de verificación, un contexto fijo, un punto de control o añadir siempre el objetivo.", "Ej.: en los resúmenes para dirección, pediré siempre las cifras con su fuente.")]],
      quiz: [
        { q: "Según el curso, entender la predicción del siguiente token mejora sobre todo…", o: ["La Delegación", "El Discernimiento", "La Diligencia"], a: 1, w: "Fluidez y exactitud son independientes." },
        { q: "Entender la memoria de trabajo mejora sobre todo…", o: ["La Descripción", "La Diligencia", "El Discernimiento"], a: 0, w: "El contexto es palanca." },
        { q: "La confianza calibrada es…", o: ["Una actitud positiva hacia la IA", "Un hábito de chequeo antes de delegar", "Confiar más en los modelos nuevos"], a: 1, w: "Ubicas la tarea y ajustas tus hábitos." }
      ] },
    { id: 14, t: "Examen del curso", en: "Course Quiz", slug: "course-quiz",
      ideas: [
        "El examen oficial está en la web del curso. Aquí tienes un <b>examen de práctica</b> en inglés con 14 preguntas que cubren todo el temario.",
        "Antes de hacerlo, repasa las <b>fichas de examen</b> (botón arriba) y el vocabulario en inglés de cada lección.",
        "Si fallas alguna, pregúntale al tutor de abajo para que te lo explique con otro ejemplo."
      ],
      terms: [["Capability zone", "zona de capacidad"], ["Limitation zone", "zona de limitación"], ["Continuum", "continuo"]],
      ficha: [["Estructura", "2 etapas (pre-training, fine-tuning) + 4 huellas + 4 propiedades + choques."], ["Para cada propiedad", "Pregunta clave, capacidad, limitación, fallos típicos, mitigaciones, conexión 4D."], ["Truco", "Si dudas, piensa: ¿qué propiedad y en qué punto del continuo?"]],
      recuerda: "Repasa las fichas y practica con tus propias tareas.",
      widgets: [["Examen de práctica (en inglés)", wExam]],
      quiz: null }
  ];

  // ============ Tutor con Claude ============
  const chats = store.get("chats", {});
  function lessonContext(l) {
    return `Lección ${l.id}: ${l.t} (${l.en})\nIdeas clave:\n- ${l.ideas.map(strip).join("\n- ")}\nFicha:\n${l.ficha.map(f => `${f[0]}: ${f[1]}`).join("\n")}\nVocabulario: ${l.terms.map(t => `${t[0]} = ${t[1]}`).join("; ")}`;
  }
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

  function renderChat(el, l) {
    const SUG = ["Explícamelo con un ejemplo de mi trabajo en una empresa", "Hazme una pregunta tipo examen y corrígeme", "¿Qué es lo más importante de esta lección para el examen?"];
    el.innerHTML = `<span class="eyebrow">Tutor</span><h3>Pregúntale a Claude sobre esta lección</h3>
      <p class="hint" id="cst">Conectando con Claude…</p>
      <div class="chatlog" id="clog" aria-live="polite"></div>
      <div class="chips" id="csug">${SUG.map(s => `<button class="chip small">${s}</button>`).join("")}</div>
      <form class="chatform" id="cf"><input type="text" id="cin" placeholder="Escribe tu duda…" autocomplete="off"><button class="btn" id="csend" type="submit">Preguntar</button><button class="btn ghost" id="cstop" type="button" hidden>Parar</button></form>
      <div class="chips"><button class="chip small" id="cclr" type="button">Borrar conversación</button></div>`;
    const log = el.querySelector("#clog"), st = el.querySelector("#cst"), form = el.querySelector("#cf"), inp = el.querySelector("#cin");
    const send = el.querySelector("#csend"), stop = el.querySelector("#cstop");
    let turns = chats[l.id] || [], ctl = null;
    const draw = () => { log.innerHTML = turns.map(t => `<div class="bub ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? esc(t.content) : md(t.content)}</div>`).join(""); log.scrollTop = log.scrollHeight; };
    const save = () => { chats[l.id] = turns.slice(-20); store.set("chats", chats); };
    draw();
    const setAvail = ok => { form.hidden = !ok; el.querySelector("#csug").hidden = !ok; st.textContent = ok ? "Responde en español, basándose en el contenido de esta lección. Usa tu cuenta de Claude; la primera vez te pedirá permiso." : "El tutor solo funciona al abrir la app desde Claude (claude.ai o la app de Claude) y con permiso para usar Claude."; };
    setAvail(false); st.textContent = "Conectando con Claude…";
    sampleReady.then(s => setAvail(!!s));
    const RULES = `Eres un tutor paciente que ayuda a una persona no técnica a estudiar el curso "AI Capabilities and Limitations" de Anthropic para preparar su examen oficial (en inglés). Responde siempre en español, claro y breve (máximo 180 palabras salvo que pida más), con ejemplos de la vida laboral cotidiana. Incluye el término en inglés entre paréntesis cuando sea útil para el examen. Básate en este contenido de la lección; si preguntan algo fuera, responde brevemente y relaciónalo con el curso. Si te pide una pregunta de examen, haz una sola pregunta tipo test en inglés con 3 opciones y espera su respuesta antes de corregir.\n\n${lessonContext(l)}`;
    async function ask(text) {
      if (!sampleFn || ctl) return;
      turns.push({ role: "user", content: text }); draw();
      const bub = document.createElement("div"); bub.className = "bub ai thinking"; bub.textContent = "Pensando…"; log.appendChild(bub); log.scrollTop = log.scrollHeight;
      ctl = new AbortController(); send.disabled = true; stop.hidden = false;
      try {
        const res = await sampleFn([{ role: "user", content: RULES }, ...turns.slice(-12)], {
          cache: false, signal: ctl.signal, onText: ({ text }) => { bub.classList.remove("thinking"); bub.innerHTML = md(text); log.scrollTop = log.scrollHeight; }
        });
        turns.push({ role: "assistant", content: res.text }); save();
      } catch (e) {
        const partial = e && e.text;
        if (partial) { turns.push({ role: "assistant", content: partial }); save(); bub.classList.remove("thinking"); }
        else bub.remove();
        if (e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "not_declared" || e.code === "capability_disabled")) { sampleFn = null; setAvail(false); }
        else if (e && e.code === "rate_limited") st.textContent = "Has hecho muchas preguntas seguidas. Espera un poco y vuelve a intentarlo.";
        else if (e && e.code !== "cancelled") st.textContent = "No se pudo obtener respuesta. Inténtalo de nuevo.";
        if (!partial) { turns.pop(); draw(); inp.value = text; }
      } finally { ctl = null; send.disabled = false; stop.hidden = true; }
    }
    form.addEventListener("submit", e => { e.preventDefault(); const v = inp.value.trim(); if (!v) return; inp.value = ""; ask(v); });
    stop.addEventListener("click", () => ctl && ctl.abort());
    el.querySelector("#csug").addEventListener("click", e => { const b = e.target.closest("button"); if (b) ask(b.textContent); });
    el.querySelector("#cclr").addEventListener("click", () => { turns = []; delete chats[l.id]; store.set("chats", chats); draw(); });
  }

  // ============ Render ============
  const nav = document.getElementById("nav"), main = document.getElementById("main");

  function setDone(id, v) { if (v) done[id] = true; else delete done[id]; store.set("done", done); progress(); }
  function progress() {
    const n = L.filter(l => done[l.id]).length;
    document.getElementById("progLbl").textContent = `${n} de ${L.length} lecciones completadas`;
    document.getElementById("progBar").style.width = (n / L.length * 100) + "%";
  }

  function renderNav(cur) {
    nav.innerHTML = L.map(l => `
      <button data-go="l${l.id}" aria-current="${l.id === cur}">
        <span class="n">${String(l.id).padStart(2, "0")}</span><span class="t">${l.t}</span>
        <span class="s">${done[l.id] ? "✓" : ""}</span>
      </button>`).join("") + `<div class="sep"></div><button class="fichas-nav" data-go="fichas" aria-current="${cur === "fichas"}"><span class="n">★</span><span class="t">Fichas de examen</span><span class="s"></span></button>`;
  }

  const fichaHTML = l => `<article class="ficha">
      <div class="fh"><span class="eyebrow">Ficha ${String(l.id).padStart(2, "0")} · ${esc(l.en)}</span><h3>${l.t}</h3></div>
      <dl>${l.ficha.map(f => `<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join("")}<dt>Vocabulario</dt><dd>${l.terms.map(t => `<b class="mono">${t[0]}</b> = ${t[1]}`).join(" · ")}</dd></dl>
      <p class="rec">${l.recuerda}</p>
    </article>`;

  function renderFichas() {
    renderNav("fichas");
    main.innerHTML = `<section class="panel lesson-head"><span class="eyebrow">Repaso</span><h2>Fichas de examen</h2>
      <p class="hint">Una ficha por lección con lo esencial: pregunta clave, zonas de capacidad y limitación, fallos típicos, mitigaciones, conexión con las 4D y vocabulario en inglés. Repásalas antes del examen oficial.</p></section>
      <div class="fichas-grid">${L.map(fichaHTML).join("")}</div>`;
  }

  function renderQuiz(el, l) {
    const state = l.quiz.map(() => false);
    el.innerHTML = `<h3>Mini test</h3><p class="hint">Si fallas, lee la pista y vuelve a intentarlo. Al acertar las tres, la lección se marca como completada.</p>` +
      l.quiz.map((q, i) => `<div class="q" data-i="${i}"><b>${i + 1}. ${q.q}</b><div class="opts">${q.o.map((o, j) => `<button class="chip" data-j="${j}">${o}</button>`).join("")}</div><p class="hint" hidden></p></div>`).join("");
    el.addEventListener("click", e => {
      const b = e.target.closest(".opts button"); if (!b) return;
      const qd = b.closest(".q"), i = +qd.dataset.i, q = l.quiz[i], ok = +b.dataset.j === q.a;
      qd.querySelectorAll("button").forEach(x => x.classList.remove("right", "wrong"));
      b.classList.add(ok ? "right" : "wrong");
      const p = qd.querySelector("p"); p.hidden = false;
      p.innerHTML = `<span class="${ok ? "tag-ok" : "tag-bad"}">${ok ? "Correcto." : "Todavía no."}</span> ${ok ? q.w : "Piensa en la idea clave de la lección y prueba otra opción."}`;
      state[i] = ok;
      if (state.every(Boolean) && !done[l.id]) { setDone(l.id, true); renderNav(l.id); updDoneBtn(l.id); }
    });
  }

  function updDoneBtn(id) {
    const b = document.getElementById("doneBtn"); if (!b) return;
    b.className = done[id] ? "btn done" : "btn ghost";
    b.textContent = done[id] ? "✓ Completada (pulsa para desmarcar)" : "Marcar como completada";
  }

  function renderLesson(id) {
    const l = L.find(x => x.id === id) || L[0];
    renderNav(l.id);
    main.innerHTML = `
      <section class="panel lesson-head">
        <span class="eyebrow">Lección ${l.id} de ${L.length}</span>
        <h2>${l.t}</h2>
        <span class="en">${l.en}</span>
        <div class="head-row"><button class="btn ghost" id="doneBtn"></button><a href="${BASE + l.slug}" target="_blank" rel="noopener">Abrir la lección original ↗</a></div>
      </section>
      <section class="panel"><h3>Ideas clave</h3><ul class="ideas">${l.ideas.map(i => `<li>${i}</li>`).join("")}</ul>
        <span class="eyebrow">Vocabulario en inglés (el examen está en inglés)</span>
        <div class="terms">${l.terms.map(t => `<span class="term"><b>${t[0]}</b> · ${t[1]}</span>`).join("")}</div>
      </section>` +
      l.widgets.map((w, i) => `<section class="panel"><span class="eyebrow">Practica</span><h3>${w[0]}</h3><div class="wbody" id="w${i}"></div></section>`).join("") +
      `<section class="panel"><span class="eyebrow">Para el examen</span>${fichaHTML(l)}</section>
      <section class="panel" id="chat"></section>` +
      (l.quiz ? `<section class="panel" id="quiz"></section>` : "") +
      `<div class="chips">${l.id > 1 ? `<button class="btn ghost" data-go="l${l.id - 1}">← Lección anterior</button>` : ""}${l.id < L.length ? `<button class="btn" data-go="l${l.id + 1}">Lección siguiente →</button>` : `<button class="btn" data-go="fichas">Repasar todas las fichas →</button>`}</div>`;
    updDoneBtn(l.id);
    document.getElementById("doneBtn").addEventListener("click", () => { setDone(l.id, !done[l.id]); updDoneBtn(l.id); renderNav(l.id); });
    l.widgets.forEach((w, i) => w[1](main.querySelector("#w" + i)));
    renderChat(main.querySelector("#chat"), l);
    if (l.quiz) renderQuiz(main.querySelector("#quiz"), l);
  }

  document.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { location.hash = b.dataset.go; window.scrollTo(0, 0); } });
  document.getElementById("goFichas").addEventListener("click", () => { location.hash = "fichas"; window.scrollTo(0, 0); });

  const route = () => {
    if (location.hash === "#fichas") return renderFichas();
    const m = /^#l(\d+)$/.exec(location.hash);
    renderLesson(m ? +m[1] : store.get("last", 1));
    if (m) store.set("last", +m[1]);
  };
  window.addEventListener("hashchange", route);
  progress(); route();
})();
</script>
